<!-- title: Label and description; description: A row with a label, a description, start content and end content. -->
<tct-vstack gap="1" max-width="24rem">
  <tct-item label="Contact name"></tct-item>
  <tct-item label="Settings" description="Manage your preferences"></tct-item>
  <tct-item label="Ada Lovelace" description="Mathematician">
    <tct-icon slot="start" name="info"></tct-icon>
    <tct-text slot="end" type="inherit" color="secondary">2h ago</tct-text>
  </tct-item>
  <tct-item description="Rich content goes through slots">
    <strong slot="label">Rich <em>label</em></strong>
  </tct-item>
</tct-vstack>
