<!-- title: Delegating to a nested control; description: The row is an enlarged click target for a checkbox in the start slot, with no second tab stop. -->
<div id="delegation-root" style="max-inline-size: 24rem">
  <tct-item interactive-selector="input" label="Receive email" description="Weekly summary of activity">
    <input slot="start" type="checkbox" aria-label="Receive email" />
  </tct-item>
</div>
