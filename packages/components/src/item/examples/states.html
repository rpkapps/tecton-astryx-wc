<!-- title: Selected and highlighted; description: Selection is exposed as aria-current (or aria-selected when the host has a role that permits it). -->
<div style="display: grid; gap: var(--spacing-1); max-inline-size: 24rem">
  <tct-item as="li" label="Rest" pressable></tct-item>
  <tct-item as="li" label="Highlighted" highlighted pressable></tct-item>
  <tct-item as="li" label="Selected" selected pressable></tct-item>
  <tct-item role="option" label="Option (aria-selected)" selected></tct-item>
  <tct-item as="li" label="Disabled" disabled pressable></tct-item>
</div>
