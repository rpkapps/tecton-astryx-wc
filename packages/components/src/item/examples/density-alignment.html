<!-- title: Density and alignment; description: compact, balanced and spacious rows, and start alignment for tall start content. -->
<tct-vstack gap="3" max-width="24rem">
  <tct-item density="compact" label="Compact" description="4px block padding"></tct-item>
  <tct-item density="balanced" label="Balanced" description="8px block padding (default)"></tct-item>
  <tct-item density="spacious" label="Spacious" description="12px block and inline padding"></tct-item>
  <tct-item
    alignment="start"
    label="Start aligned"
    description="The start and end content sit against the first line, not the middle of two lines"
  >
    <tct-icon slot="start" name="info"></tct-icon>
    <tct-text slot="end" type="inherit" color="secondary">Draft</tct-text>
  </tct-item>
</tct-vstack>
