<!-- title: Checkbox indicator; description: The checkbox box in its three states and two sizes, enabled and disabled. -->
<tct-vstack gap="3">
  <tct-hstack gap="4" v-align="center">
    <tct-checkbox-indicator state="unchecked"></tct-checkbox-indicator>
    <tct-checkbox-indicator state="checked"></tct-checkbox-indicator>
    <tct-checkbox-indicator state="indeterminate"></tct-checkbox-indicator>
    <tct-text type="inherit" color="secondary">md (24px)</tct-text>
  </tct-hstack>
  <tct-hstack gap="4" v-align="center">
    <tct-checkbox-indicator size="sm" state="unchecked"></tct-checkbox-indicator>
    <tct-checkbox-indicator size="sm" state="checked"></tct-checkbox-indicator>
    <tct-checkbox-indicator size="sm" state="indeterminate"></tct-checkbox-indicator>
    <tct-text type="inherit" color="secondary">sm (20px)</tct-text>
  </tct-hstack>
  <tct-hstack gap="4" v-align="center">
    <tct-checkbox-indicator disabled state="unchecked"></tct-checkbox-indicator>
    <tct-checkbox-indicator disabled state="checked"></tct-checkbox-indicator>
    <tct-checkbox-indicator disabled state="indeterminate"></tct-checkbox-indicator>
    <tct-text type="inherit" color="secondary">disabled</tct-text>
  </tct-hstack>
</tct-vstack>
