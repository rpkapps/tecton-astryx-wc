<!-- title: Replacement content while pending; description: Default-slot content is drawn instead of the state mark and keeps the chrome, so a pending spinner does not move the row. -->
<div style="display: flex; align-items: center; gap: var(--spacing-4)">
  <tct-checkbox-indicator state="checked">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="20 18" />
    </svg>
  </tct-checkbox-indicator>
  <tct-radio-indicator state="unchecked">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="20 18" />
    </svg>
  </tct-radio-indicator>
  <tct-check-indicator state="unchecked">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="20 18" />
    </svg>
  </tct-check-indicator>
</div>
