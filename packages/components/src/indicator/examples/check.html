<!-- title: Check indicator; description: The mark on a chosen option: a check when chosen, nothing (and no reserved space) when not.; a11y-exempt: color-contrast | The last row demonstrates a disabled option: its label is painted with the disabled text colour, and WCAG 1.4.3 exempts text of inactive user interface components. -->
<tct-vstack gap="1" max-width="20rem">
  <tct-hstack gap="2" v-align="center">
    <tct-check-indicator state="checked"></tct-check-indicator>
    <span>Chosen option</span>
  </tct-hstack>
  <tct-hstack gap="2" v-align="center">
    <tct-check-indicator state="unchecked"></tct-check-indicator>
    <span>Unchosen option (the indicator takes no space)</span>
  </tct-hstack>
  <tct-hstack gap="2" v-align="center">
    <tct-check-indicator state="checked" disabled></tct-check-indicator>
    <tct-text type="inherit" color="disabled">Disabled, chosen</tct-text>
  </tct-hstack>
</tct-vstack>
