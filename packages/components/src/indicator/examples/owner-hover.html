<!-- title: Hover from the owner; description: An owner publishes hover to its indicator with the inherited --_indicator-hover property (the indicator-scope class in a component sheet). Here the row does it by hand. -->
<style>
  #owner-hover-row:hover {
    --_indicator-hover: 1;
  }
</style>
<tct-hstack id="owner-hover-row" gap="2" v-align="center" padding="2">
  <tct-checkbox-indicator state="unchecked"></tct-checkbox-indicator>
  <span>Hover this row: the box border brightens</span>
</tct-hstack>
