<!-- title: Width and elevation; description: width takes a number (px) or a CSS length; 100% fills the container. elevation lifts a floating button. -->
<tct-vstack gap="3" width="320">
  <tct-button variant="primary" label="Sign in" width="100%"></tct-button>
  <tct-button label="240px wide" width="240"></tct-button>
  <tct-hstack gap="4" padding="3">
    <tct-button label="Low" elevation="low"></tct-button>
    <tct-button label="Med" elevation="med"></tct-button>
    <tct-button label="High" elevation="high" variant="primary"></tct-button>
  </tct-hstack>
</tct-vstack>
