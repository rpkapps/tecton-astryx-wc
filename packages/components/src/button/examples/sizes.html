<!-- title: Sizes; description: sm (28px), md (32px) and lg (36px), with and without an icon. Wrap in a size provider to size a whole region. -->
<tct-hstack gap="3" v-align="center">
  <tct-button size="sm" variant="primary" label="Small"></tct-button>
  <tct-button size="md" variant="primary" label="Medium"></tct-button>
  <tct-button size="lg" variant="primary" label="Large"></tct-button>
  <tct-button size="sm" label="Small" icon="search"></tct-button>
  <tct-button size="md" label="Medium" icon="search"></tct-button>
  <tct-button size="lg" label="Large" icon="search"></tct-button>
</tct-hstack>
