<!-- title: Disabled with a reason; description: With a tooltip a disabled button stays focusable (aria-disabled) and the tooltip says why. Without one it is natively disabled. -->
<tct-hstack wrap="wrap" gap="3" v-align="center" padding-block-start="8">
  <tct-button variant="primary" label="Publish" disabled tooltip="Add a title before publishing"></tct-button>
  <tct-button variant="primary" label="Publish" disabled></tct-button>
</tct-hstack>
