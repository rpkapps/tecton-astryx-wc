<!-- title: In a form; description: type=submit submits the form with the button's name and value; Enter in a field activates it; type=reset resets. -->
<form id="in-form-demo">
  <tct-vstack gap="3" max-width="320">
    <label>
      <tct-vstack gap="1">
        Name
        <input name="name" value="Ada" required />
      </tct-vstack>
    </label>
    <tct-hstack gap="2">
      <tct-button type="submit" name="action" value="save" variant="primary" label="Save"></tct-button>
      <tct-button type="submit" name="action" value="draft" formnovalidate label="Save draft"></tct-button>
      <tct-button type="reset" variant="text-only" label="Reset"></tct-button>
    </tct-hstack>
    <output><tct-text id="in-form-demo-result" type="inherit" color="secondary">Submit to see the data.</tct-text></output>
  </tct-vstack>
</form>
<script type="module">
  const form = document.querySelector('#in-form-demo');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const data = new FormData(form, event.submitter);
    document.querySelector('#in-form-demo-result').textContent = JSON.stringify(Object.fromEntries(data));
  });
</script>
