<!-- title: Status; description: status-type and status-message put a message under the control, announced once. An error also marks a wrapped tct-* control invalid. -->
<tct-vstack gap="4">
  <tct-field label="Email" status-type="error" status-message="Email must include an @."><input name="email" value="ada.example.com" /></tct-field>
  <tct-field label="Name" status-type="warning" status-message="This name is already in use."><input name="name" value="North" /></tct-field>
  <tct-field label="Code" status-type="success" status-message="Code accepted."><input name="code" value="A-12" /></tct-field>
</tct-vstack>
