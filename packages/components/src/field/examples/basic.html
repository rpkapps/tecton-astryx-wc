<!-- title: Basic; description: tct-field gives a native input a label, a description and a status. The label is a real association: a click on it focuses the input. -->
<tct-field label="Project code" description="Letters and digits, as printed on the licence.">
  <input name="code" autocomplete="off" style="inline-size: 100%; box-sizing: border-box; padding: var(--spacing-2); font: inherit; color: inherit; background: transparent; border: var(--border-width) solid var(--color-border); border-radius: var(--radius-element)" />
</tct-field>
