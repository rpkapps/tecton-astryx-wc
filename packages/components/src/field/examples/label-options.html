<!-- title: Label options; description: label-icon adds a glyph, label-tooltip an info button after the label, and label-hidden hides the label visually while keeping it for assistive technology. -->
<tct-vstack gap="4">
  <tct-field label="Depth" label-icon="info"><input name="depth" /></tct-field>
  <tct-field label="Sampling rate" label-tooltip="Samples per second, at the recorder."><input name="rate" /></tct-field>
  <tct-field label="Search wells" label-hidden><input type="search" name="q" placeholder="Search wells" /></tct-field>
</tct-vstack>
