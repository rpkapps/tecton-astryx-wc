<!-- title: Required and optional; description: The indicator is text beside the label, not a colour. required shows Required and optional shows Optional; set only one. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4)">
  <tct-field label="Well name" required><input style="inline-size: 100%; box-sizing: border-box; padding: var(--spacing-2); font: inherit; color: inherit; background: transparent; border: var(--border-width) solid var(--color-border); border-radius: var(--radius-element)" name="well" /></tct-field>
  <tct-field label="Nickname" optional><input style="inline-size: 100%; box-sizing: border-box; padding: var(--spacing-2); font: inherit; color: inherit; background: transparent; border: var(--border-width) solid var(--color-border); border-radius: var(--radius-element)" name="nick" /></tct-field>
</div>
