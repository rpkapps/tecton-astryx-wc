<!-- title: Range; description: range gives two thumbs that cannot pass each other; min-steps-between-thumbs keeps them apart. The group carries the label and the thumbs are named Minimum value and Maximum value. A range submits two entries. -->
<tct-vstack gap="4">
  <tct-slider label="Price range" range value="20,80" value-display="text" name="price"></tct-slider>
  <tct-slider label="Keep 10 apart" range value="30,60" min-steps-between-thumbs="10" name="gap"></tct-slider>
</tct-vstack>
