<!-- title: Marks; description: marks draw ticks on the track with optional labels. A press on a tick snaps to it, and the ticks under the fill take the fill colour. -->
<tct-vstack gap="4">
  <tct-slider label="Quality" value="50" step="25" marks='[{"value":0,"label":"Low"},{"value":25},{"value":50,"label":"Medium"},{"value":75},{"value":100,"label":"High"}]' name="quality"></tct-slider>
  <tct-slider label="Range with marks" range value="25,75" value-display="none" marks='[{"value":0,"label":"0"},{"value":50},{"value":100,"label":"100"}]'></tct-slider>
</tct-vstack>
