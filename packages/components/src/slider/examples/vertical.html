<!-- title: Vertical; description: orientation="vertical" puts the minimum at the bottom. The Up and Down arrow keys step as they do on a horizontal slider. -->
<tct-hstack gap="8">
  <tct-slider label="Volume" orientation="vertical" value="60" name="vvolume"></tct-slider>
  <tct-slider label="Range" orientation="vertical" range value="20,70" name="vrange"></tct-slider>
</tct-hstack>
