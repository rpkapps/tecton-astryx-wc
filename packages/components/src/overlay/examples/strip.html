<!-- title: Bottom strip; description: position="bottom" is a strip on the block end that slides in. Use top for the block start. -->
<tct-hstack wrap="wrap" gap="4">
  <tct-overlay show-on="always" position="bottom" alignment="start" style="inline-size: 320px">
    <tct-card padding="0" height="180" style="--card-background-color: var(--color-on-light)">
      <tct-media-theme mode="dark"><tct-center height="100%"><tct-text>Media</tct-text></tct-center></tct-media-theme>
    </tct-card>
    <tct-vstack slot="content" gap="0"><strong>Deepwater A-12</strong><span>Updated 2 hours ago</span></tct-vstack>
  </tct-overlay>
  <tct-overlay show-on="hover" position="top" alignment="end" style="inline-size: 320px">
    <tct-card padding="0" height="180" style="--card-background-color: var(--color-on-light)">
      <tct-media-theme mode="dark"><tct-center height="100%"><tct-link href="#top" color="primary">Media</tct-link></tct-center></tct-media-theme>
    </tct-card>
    <div slot="content"><button type="button">Open</button></div>
  </tct-overlay>
</tct-hstack>
