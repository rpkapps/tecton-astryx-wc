<!-- title: Controlled; description: Setting open forces the overlay shown (attribute) or hidden and inert (property false). Set it to undefined to hand control back to show-on. -->
<tct-vstack id="overlay-controlled-root" gap="3" h-align="start">
  <tct-overlay show-on="hover" open style="inline-size: 320px">
    <tct-card padding="0" height="180" style="--card-background-color: var(--color-on-light)">
      <tct-media-theme mode="dark"><tct-center height="100%"><tct-text>Media</tct-text></tct-center></tct-media-theme>
    </tct-card>
    <div slot="content"><button type="button">Quick view</button></div>
  </tct-overlay>
  <button type="button" id="overlay-controlled-toggle">Toggle overlay</button>
  <script type="module">
    const root = document.getElementById('overlay-controlled-root');
    const overlay = root.querySelector('tct-overlay');
    root.querySelector('#overlay-controlled-toggle').addEventListener('click', () => {
      overlay.open = overlay.open === true ? false : true;
    });
  </script>
</tct-vstack>
