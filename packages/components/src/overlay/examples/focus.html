<!-- title: Reveal on focus; description: show-on="focus" ignores hover: the overlay shows while focus is inside the container. -->
<tct-overlay show-on="focus" position="bottom" style="inline-size: 320px">
  <tct-card padding="0" height="180" style="--card-background-color: var(--color-on-light)">
    <tct-media-theme mode="dark"><tct-center height="100%"><tct-link href="#focus" color="primary">Media</tct-link></tct-center></tct-media-theme>
  </tct-card>
  <div slot="content"><button type="button">Actions</button></div>
</tct-overlay>
