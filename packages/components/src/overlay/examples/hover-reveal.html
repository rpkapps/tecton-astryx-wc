<!-- title: Reveal on hover; description: The default fill scrim, revealed on hover and on keyboard focus. Hidden content stays reachable by Tab and reveals when focus lands inside. -->
<tct-overlay show-on="hover" style="inline-size: 320px; border-radius: var(--radius-container)">
  <a href="#media" style="display: block; text-decoration: none"><div style="display: grid; place-items: center; inline-size: 320px; block-size: 180px; background: var(--color-on-light); color: var(--color-on-dark)">Media</div></a>
  <div slot="content"><button type="button">Quick view</button></div>
</tct-overlay>
