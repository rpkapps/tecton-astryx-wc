<!-- title: Label position and spacing; description: label-position puts the label before the track; label-spacing="spread" pushes label and track to opposite ends of the row, so a list of settings lines up. -->
<tct-vstack gap="4">
  <tct-switch label="Label after the track (default)" checked></tct-switch>
  <tct-switch label="Label before the track" label-position="start" checked></tct-switch>
  <tct-switch label="Spread across the row" label-spacing="spread" width="360" checked></tct-switch>
  <tct-switch label="Label before, spread" label-position="start" label-spacing="spread" width="360"></tct-switch>
</tct-vstack>
