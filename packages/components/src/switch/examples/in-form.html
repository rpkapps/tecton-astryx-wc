<!-- title: In a form; description: A switch submits name=value while on. A required switch blocks the submit while it is off and shows its error only then. Reset returns to the checked attribute. -->
<!-- layout: pending tct-stack -->
<form id="in-form-switch-example">
  <tct-switch label="Accept the terms" name="terms" required></tct-switch>
  <tct-switch label="Weekly digest" name="digest" value="weekly" checked></tct-switch>
  <tct-button type="submit" variant="primary">Save</tct-button>
  <tct-button type="reset">Reset</tct-button>
  <output></output>
</form>
<script type="module">
  const form = document.getElementById('in-form-switch-example');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    form.querySelector('output').textContent = JSON.stringify(Object.fromEntries(new FormData(form, event.submitter)));
  });
</script>
