<!-- title: Async changes; description: changeAction runs after a toggle. The thumb shows a spinner and the switch cannot be toggled until the promise settles; if it rejects, the switch returns to its previous state. -->
<tct-vstack id="async-root" gap="4">
  <tct-switch label="Sync automatically" description="Each change is saved to the server." data-save="ok"></tct-switch>
  <tct-switch label="This one fails to save" description="It turns back after a moment." data-save="fail"></tct-switch>
</tct-vstack>
<script type="module">
  const save = (fail) => () =>
    new Promise((resolve, reject) => {
      setTimeout(() => (fail ? reject(new Error('Could not save')) : resolve()), 1200);
    });
  for (const item of document.querySelectorAll('#async-root tct-switch')) {
    item.changeAction = save(item.dataset.save === 'fail');
  }
</script>
