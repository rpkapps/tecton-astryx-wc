<!-- title: Floating action; description: elevation raises an icon button above content, the usual shape of a floating action button. -->
<div style="display: flex; gap: var(--spacing-5); padding: var(--spacing-4)">
  <tct-icon-button variant="primary" elevation="low" icon="check" label="Add (low)"></tct-icon-button>
  <tct-icon-button variant="primary" elevation="med" icon="check" label="Add (medium)"></tct-icon-button>
  <tct-icon-button variant="primary" elevation="high" icon="check" label="Add (high)"></tct-icon-button>
</div>
