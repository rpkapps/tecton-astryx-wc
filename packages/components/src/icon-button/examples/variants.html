<!-- title: Variants; description: The button emphases. Ghost suits toolbars and dense areas. -->
<div style="display: flex; gap: var(--spacing-3)">
  <tct-icon-button variant="primary" icon="check" label="Confirm"></tct-icon-button>
  <tct-icon-button variant="secondary" icon="search" label="Search"></tct-icon-button>
  <tct-icon-button variant="ghost" icon="menu" label="Menu"></tct-icon-button>
  <tct-icon-button variant="outlined" icon="copy" label="Copy"></tct-icon-button>
  <tct-icon-button variant="text-only" icon="externalLink" label="Open in a new tab"></tct-icon-button>
  <tct-icon-button variant="destructive" icon="close" label="Delete conversation"></tct-icon-button>
</div>
