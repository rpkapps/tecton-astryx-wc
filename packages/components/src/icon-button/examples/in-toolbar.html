<!-- title: In a toolbar; description: Ghost icon buttons in a toolbar: one Tab stop, arrows between them, and the toolbar size cascades. -->
<tct-toolbar label="Formatting" size="sm" variant="section" dividers="bottom">
  <tct-icon-button slot="start" variant="ghost" icon="copy" label="Copy"></tct-icon-button>
  <tct-icon-button slot="start" variant="ghost" icon="search" label="Find"></tct-icon-button>
  <tct-icon-button slot="end" variant="ghost" icon="menu" label="More actions"></tct-icon-button>
</tct-toolbar>
