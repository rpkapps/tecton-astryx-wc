<!-- title: Basic; description: An icon with a specific label. The label is the accessible name and the tooltip; nothing is painted as text. -->
<div style="display: flex; gap: var(--spacing-3)">
  <tct-icon-button icon="search" label="Search"></tct-icon-button>
  <tct-icon-button icon="copy" label="Copy to clipboard"></tct-icon-button>
  <tct-icon-button icon="menu" label="Open menu"></tct-icon-button>
</div>
