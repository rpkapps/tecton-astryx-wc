<!-- title: Loading and disabled; description: A loading button shows a spinner and stays focusable; a disabled one with a tooltip keeps the reason reachable. -->
<div style="display: flex; gap: var(--spacing-3)">
  <tct-icon-button icon="check" label="Saving" loading></tct-icon-button>
  <tct-icon-button icon="check" label="Save" disabled></tct-icon-button>
  <tct-icon-button icon="check" label="Save" disabled tooltip="Nothing to save yet"></tct-icon-button>
</div>
