<!-- title: Link and button; description: href makes a link, interactive a button; both need a name. -->
<tct-hstack gap="3" v-align="center">
  <tct-avatar name="Ada Lovelace" href="#ada" size="lg"></tct-avatar>
  <tct-avatar id="interactive-open" name="Grace Hopper" interactive size="lg"></tct-avatar>
  <tct-text color="secondary"><output id="interactive-output"></output></tct-text>
</tct-hstack>
<script type="module">
  const output = document.getElementById('interactive-output');
  document.getElementById('interactive-open').addEventListener('click', () => {
    output.textContent = 'Opened Grace Hopper';
  });
</script>
