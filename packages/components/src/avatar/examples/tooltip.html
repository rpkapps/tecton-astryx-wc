<!-- title: Name tooltip; description: The name shows on hover and keyboard focus; a string replaces it and false turns it off. -->
<div style="display: flex; gap: var(--spacing-4); align-items: center; padding-block-start: var(--spacing-8)">
  <tct-avatar name="Ada Lovelace"></tct-avatar>
  <tct-avatar name="jsmith" tooltip="Jane Smith, Staff Engineer"></tct-avatar>
  <tct-avatar name="Jane" tooltip="false"></tct-avatar>
</div>
