<!-- title: Group shapes; description: The group's shape applies to every member and to the overflow chip. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4)">
  <tct-avatar-group shape="rounded" size="lg">
    <tct-avatar name="Ada Lovelace"></tct-avatar>
    <tct-avatar name="Grace Hopper"></tct-avatar>
    <tct-avatar-group-overflow count="3"></tct-avatar-group-overflow>
  </tct-avatar-group>
  <tct-avatar-group shape="square" size="lg">
    <tct-avatar name="Ada Lovelace"></tct-avatar>
    <tct-avatar name="Grace Hopper"></tct-avatar>
    <tct-avatar-group-overflow count="3"></tct-avatar-group-overflow>
  </tct-avatar-group>
</div>
