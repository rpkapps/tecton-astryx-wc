<!-- title: Avatar group; description: A stacked facepile; the group sizes its members and the overflow chip carries the rest. -->
<tct-vstack gap="4">
  <tct-avatar-group aria-label="Project members">
    <tct-avatar name="Ada Lovelace"></tct-avatar>
    <tct-avatar name="Grace Hopper"></tct-avatar>
    <tct-avatar name="Alan Turing"></tct-avatar>
    <tct-avatar-group-overflow count="5"></tct-avatar-group-overflow>
  </tct-avatar-group>
  <tct-avatar-group size="lg">
    <tct-avatar name="Ada Lovelace">
      <tct-avatar-status-dot slot="status" variant="success" label="Online"></tct-avatar-status-dot>
    </tct-avatar>
    <tct-avatar name="Grace Hopper"></tct-avatar>
    <tct-avatar-group-overflow count="12"></tct-avatar-group-overflow>
  </tct-avatar-group>
</tct-vstack>
