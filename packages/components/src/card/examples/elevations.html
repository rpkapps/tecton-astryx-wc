<!-- title: Elevations; description: elevation sets the resting shadow: none (flat, default), low, med, high. Raise it only to float above content. -->
<tct-grid id="elevations" columns="4" gap="4" padding="4">
  <tct-card elevation="none">none</tct-card>
  <tct-card elevation="low">low</tct-card>
  <tct-card elevation="med">med</tct-card>
  <tct-card elevation="high">high</tct-card>
</tct-grid>
