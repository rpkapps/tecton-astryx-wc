<!-- title: Full-bleed content; description: A divider with full-bleed and a nested section with its own padding run to the card's edges: the card publishes its padding for them. -->
<tct-card width="320">
  <tct-vstack gap="3">
    <tct-text type="medium-strong">Field summary</tct-text>
    <tct-divider full-bleed></tct-divider>
    <span>Content inside the card padding.</span>
    <tct-section variant="muted" padding="3"><span>A section bleeding to the card edges.</span></tct-section>
  </tct-vstack>
</tct-card>
