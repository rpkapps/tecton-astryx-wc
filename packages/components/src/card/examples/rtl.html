<!-- title: Right-to-left; description: Padding edges are logical, so padding-inline-start pads the right edge in RTL. -->
<tct-vstack id="rtl" gap="4" max-width="320">
  <div dir="ltr"><tct-card padding-inline-start="8">ltr: extra padding at the start (left)</tct-card></div>
  <div dir="rtl"><tct-card padding-inline-start="8">rtl: extra padding at the start (right)</tct-card></div>
</tct-vstack>
