<!-- title: Variants; description: default, transparent and muted, and ten colour variants for categorisation (not for status). -->
<div id="variants" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--spacing-3)">
  <tct-card variant="default">default</tct-card>
  <tct-card variant="transparent">transparent</tct-card>
  <tct-card variant="muted">muted</tct-card>
  <tct-card variant="blue">blue</tct-card>
  <tct-card variant="cyan">cyan</tct-card>
  <tct-card variant="gray">gray</tct-card>
  <tct-card variant="green">green</tct-card>
  <tct-card variant="orange">orange</tct-card>
  <tct-card variant="pink">pink</tct-card>
  <tct-card variant="purple">purple</tct-card>
  <tct-card variant="red">red</tct-card>
  <tct-card variant="teal">teal</tct-card>
  <tct-card variant="yellow">yellow</tct-card>
</div>
