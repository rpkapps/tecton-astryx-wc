<!-- title: Padding; description: padding takes a spacing step; the axis and edge attributes refine it. The border is drawn inside the padding, so the content sits exactly padding away from the outer edge. -->
<div id="padding" style="display: flex; flex-wrap: wrap; gap: var(--spacing-4)">
  <tct-card padding="2">padding="2"</tct-card>
  <tct-card padding="6">padding="6"</tct-card>
  <tct-card padding="1" padding-inline="6">padding-inline="6"</tct-card>
  <tct-card padding="0">padding="0"</tct-card>
</div>
