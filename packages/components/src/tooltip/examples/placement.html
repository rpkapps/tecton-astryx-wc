<!-- title: Placement and alignment; description: The tooltip prefers a side of the trigger and flips when there is no room. start and end follow the writing direction. -->
<tct-hstack wrap="wrap" gap="4" padding="10">
  <tct-tooltip content="Above (default)" placement="above"><tct-button>Above</tct-button></tct-tooltip>
  <tct-tooltip content="Below" placement="below"><tct-button>Below</tct-button></tct-tooltip>
  <tct-tooltip content="Start side" placement="start"><tct-button>Start</tct-button></tct-tooltip>
  <tct-tooltip content="End side" placement="end"><tct-button>End</tct-button></tct-tooltip>
  <tct-tooltip content="Aligned to the start edge" placement="below" alignment="start"><tct-button>Aligned start</tct-button></tct-tooltip>
  <tct-tooltip content="Aligned to the end edge" placement="below" alignment="end"><tct-button>Aligned end</tct-button></tct-tooltip>
</tct-hstack>
