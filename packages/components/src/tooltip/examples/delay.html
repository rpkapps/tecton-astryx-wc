<!-- title: Delays; description: delay is how long a hover waits before opening (default 200 ms), hide-delay how long leaving waits before closing. -->
<div style="display: flex; gap: var(--spacing-4)">
  <tct-tooltip content="Opens immediately" delay="0"><tct-button>No delay</tct-button></tct-tooltip>
  <tct-tooltip content="Opens after a second" delay="1000"><tct-button>Slow</tct-button></tct-tooltip>
  <tct-tooltip content="Stays for a moment after leaving" hide-delay="600"><tct-button>Lingers</tct-button></tct-tooltip>
</div>
