<!-- title: With a citation; description: cite is the attribution, rendered as a semantic <cite> after the quote. The cite slot takes markup. -->
<div id="with-citation" style="display: grid; gap: var(--spacing-5); max-inline-size: 420px">
  <tct-blockquote cite="Steve Jobs">Design is not just what it looks like and feels like. Design is how it works.</tct-blockquote>
  <tct-blockquote>Simplicity is the ultimate sophistication.<span slot="cite">Leonardo da Vinci, <em>attributed</em></span></tct-blockquote>
</div>
