<!-- title: Pull quote; description: Style the part for a pull quote: a larger size on ::part(base). -->
<style>
  #pull-quote tct-blockquote::part(base) {
    font-size: var(--font-size-xl);
    line-height: 1.4;
    color: var(--color-text-primary);
  }
</style>
<div id="pull-quote" style="max-inline-size: 480px">
  <tct-blockquote cite="Interview, March">The best interface is the one you stop noticing.</tct-blockquote>
</div>
