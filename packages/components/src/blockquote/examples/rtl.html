<!-- title: Right-to-left; description: The rule and the padding are logical, so they move to the right edge under dir="rtl". -->
<div id="rtl" style="display: grid; gap: var(--spacing-5); max-inline-size: 420px">
  <tct-blockquote dir="ltr" cite="Left to right">A quotation in a left-to-right language.</tct-blockquote>
  <tct-blockquote dir="rtl" cite="من اليمين إلى اليسار">اقتباس بلغة تُكتب من اليمين إلى اليسار.</tct-blockquote>
</div>
