<!-- title: Right to left; description: The sheet keeps its block-axis behaviour in right-to-left contexts (Arrow Up and Arrow Down do not mirror), the handle name and its value are localized, and the layout uses logical properties. -->
<div dir="rtl" lang="ar">
  <tct-button id="sheet-rtl-open" label="فتح المرشحات"></tct-button>
  <tct-bottom-sheet id="sheet-rtl" label="المرشحات" height="tall" snap-points="50%">
    <tct-vstack gap="3" padding="4">
      <tct-heading level="3">المرشحات</tct-heading>
      <label><input type="checkbox" /> متوفر في المخزون</label>
      <label><input type="checkbox" /> عروض</label>
    </tct-vstack>
  </tct-bottom-sheet>
  <script type="module">
    const sheet = document.getElementById('sheet-rtl');
    document.getElementById('sheet-rtl-open').addEventListener('click', () => {
      sheet.open = true;
    });
  </script>
</div>
