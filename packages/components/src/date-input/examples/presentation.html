<!-- title: Presentation; description: presentation chooses the surface. Popover under the field, bottom sheet, the browser's own date input, or adaptive: a bottom sheet on a compact touch device, the browser's picker with a coarse pointer. The deprecated native-picker maps to the same values. -->
<tct-vstack gap="3" max-width="360">
  <tct-date-input label="popover" presentation="popover" value="2026-03-21"></tct-date-input>
  <tct-date-input label="bottom-sheet" presentation="bottom-sheet" value="2026-03-21"></tct-date-input>
  <tct-date-input label="native" presentation="native" value="2026-03-21"></tct-date-input>
  <tct-date-input label="adaptive-bottom-sheet" presentation="adaptive-bottom-sheet" value="2026-03-21"></tct-date-input>
  <tct-date-input label="adaptive-native (default)" value="2026-03-21"></tct-date-input>
  <tct-date-input label="Two months" number-of-months="2" week-starts-on="mon" value="2026-03-21"></tct-date-input>
</tct-vstack>
