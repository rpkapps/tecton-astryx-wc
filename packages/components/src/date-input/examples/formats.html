<!-- title: Formats; description: format sets how the committed date is shown: date_long (default), date, date_weekday, system_date. The typed text is never reformatted while you type, and the value is always YYYY-MM-DD. -->
<tct-vstack gap="3" max-width="360">
  <tct-date-input label="date_long" value="2026-03-21"></tct-date-input>
  <tct-date-input label="date" format="date" value="2026-03-21"></tct-date-input>
  <tct-date-input label="date_weekday" format="date_weekday" value="2026-03-21"></tct-date-input>
  <tct-date-input label="system_date" format="system_date" value="2026-03-21"></tct-date-input>
</tct-vstack>
