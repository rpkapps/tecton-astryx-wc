<!-- title: In a form; description: The field submits YYYY-MM-DD under its name, blocks a submit while a required value is missing (and only then shows the error), and is restored by reset. Enter commits the typed text and submits. -->
<tct-vstack max-width="420">
  <form id="in-form-root">
    <tct-form-layout>
      <tct-date-input label="Arrival" name="arrival" required min="2026-03-01" description="Press Enter to submit."></tct-date-input>
      <tct-date-input label="Departure" name="departure" value="2026-03-08" has-clear></tct-date-input>
      <tct-hstack gap="2">
        <tct-button type="submit" variant="primary">Book</tct-button>
        <tct-button type="reset">Reset</tct-button>
      </tct-hstack>
      <output></output>
    </tct-form-layout>
  </form>
</tct-vstack>
<script type="module">
  const form = document.getElementById('in-form-root');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    form.querySelector('output').textContent = JSON.stringify(Object.fromEntries(new FormData(form, event.submitter)));
  });
</script>
