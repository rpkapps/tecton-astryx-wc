<!-- title: Dividers; description: has-dividers separates rows with a 1px rule and makes them flush rectangles. -->
<div style="max-inline-size: 24rem">
  <tct-list has-dividers header="With dividers">
    <tct-list-item label="First" description="A description"></tct-list-item>
    <tct-list-item label="Second" description="A description"></tct-list-item>
    <tct-list-item label="Third" description="No divider after the last row"></tct-list-item>
  </tct-list>
</div>
