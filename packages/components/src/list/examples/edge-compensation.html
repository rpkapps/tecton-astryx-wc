<!-- title: Edge compensation; description: edge-compensation="inline" cancels the rows inline inset up to the container padding, so row text lines up with a heading above the list. -->
<tct-card padding="4" max-width="24rem" style="--_container-padding-inline-start: var(--spacing-4); --_container-padding-inline-end: var(--spacing-4)">
  <tct-vstack gap="2">
    <tct-text type="inherit" weight="bold">Section heading</tct-text>
    <tct-list edge-compensation="inline">
      <tct-list-item pressable label="Row text lines up with the heading"></tct-list-item>
      <tct-list-item pressable label="Hover and selection still reach past the text"></tct-list-item>
    </tct-list>
  </tct-vstack>
</tct-card>
