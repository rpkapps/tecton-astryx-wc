<!-- title: Basic list; description: A list with a header, start content, descriptions and end content. -->
<div style="max-inline-size: 24rem">
  <tct-list header="Recent files">
    <tct-list-item label="Quarterly report" description="Edited 2 hours ago">
      <tct-icon slot="start" name="info"></tct-icon>
      <span slot="end" style="color: var(--color-text-secondary)">PDF</span>
    </tct-list-item>
    <tct-list-item label="Budget" description="Edited yesterday">
      <tct-icon slot="start" name="info"></tct-icon>
      <span slot="end" style="color: var(--color-text-secondary)">XLSX</span>
    </tct-list-item>
    <tct-list-item label="Meeting notes">
      <tct-icon slot="start" name="info"></tct-icon>
    </tct-list-item>
  </tct-list>
</div>
