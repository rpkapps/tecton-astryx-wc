<!-- title: Markers; description: list-style draws bullets, rings or numbers; decimal renders an ordered list and start sets the first number. -->
<tct-vstack gap="6" max-width="24rem">
  <tct-list list-style="disc" header="Disc">
    <tct-list-item label="First point"></tct-list-item>
    <tct-list-item label="Second point"></tct-list-item>
  </tct-list>
  <tct-list list-style="circle" header="Circle">
    <tct-list-item label="First point"></tct-list-item>
    <tct-list-item label="Second point"></tct-list-item>
  </tct-list>
  <tct-list list-style="decimal" start="3" header="Decimal, starting at 3">
    <tct-list-item label="Third step"></tct-list-item>
    <tct-list-item label="Fourth step"></tct-list-item>
    <tct-list-item label="Fifth step"></tct-list-item>
  </tct-list>
</tct-vstack>
