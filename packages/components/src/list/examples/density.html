<!-- title: Density; description: compact, balanced and spacious rows. -->
<tct-vstack gap="6" max-width="24rem">
  <tct-list density="compact" header="Compact">
    <tct-list-item label="First"></tct-list-item>
    <tct-list-item label="Second"></tct-list-item>
  </tct-list>
  <tct-list density="balanced" header="Balanced (default)">
    <tct-list-item label="First"></tct-list-item>
    <tct-list-item label="Second"></tct-list-item>
  </tct-list>
  <tct-list density="spacious" header="Spacious">
    <tct-list-item label="First"></tct-list-item>
    <tct-list-item label="Second"></tct-list-item>
  </tct-list>
</tct-vstack>
