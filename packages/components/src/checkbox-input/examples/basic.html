<!-- title: Basic; description: A checkbox with a label and a description. It is form-associated: give it a name to submit it. Clicking the label or the description toggles it. -->
<tct-vstack gap="4">
  <tct-checkbox-input label="Accept terms" description="You agree to the terms of service." name="terms"></tct-checkbox-input>
  <tct-checkbox-input label="Subscribe to updates" name="updates" checked></tct-checkbox-input>
  <tct-checkbox-input label="Compact box" size="sm" name="compact"></tct-checkbox-input>
</tct-vstack>
