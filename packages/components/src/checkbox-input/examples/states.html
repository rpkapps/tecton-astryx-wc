<!-- title: States; description: Checked, hidden label, required and optional indicators, disabled, read-only, loading and every status. Read-only shows the state at full strength; disabled dims it. -->
<tct-vstack gap="4">
  <tct-checkbox-input label="Checked" checked></tct-checkbox-input>
  <tct-checkbox-input label="Label hidden but named" label-hidden checked></tct-checkbox-input>
  <tct-checkbox-input label="Required" required></tct-checkbox-input>
  <tct-checkbox-input label="Optional" optional label-icon="info" label-tooltip="Optional choices are never required."></tct-checkbox-input>
  <tct-checkbox-input label="Disabled" disabled></tct-checkbox-input>
  <tct-checkbox-input label="Disabled and checked" disabled checked></tct-checkbox-input>
  <tct-checkbox-input label="Read-only" readonly checked></tct-checkbox-input>
  <tct-checkbox-input label="Loading" loading></tct-checkbox-input>
  <tct-checkbox-input label="Error" status-type="error" status-message="You must accept to continue."></tct-checkbox-input>
  <tct-checkbox-input label="Warning" status-type="warning" status-message="This choice can be changed later only by an admin."></tct-checkbox-input>
  <tct-checkbox-input label="Success" status-type="success" status-message="Saved."></tct-checkbox-input>
</tct-vstack>
