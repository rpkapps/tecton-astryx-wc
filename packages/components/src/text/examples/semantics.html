<!-- title: Semantics; description: as sets the host semantics: p is a paragraph, h1 to h3 are headings. span and div add no role. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-2)">
  <tct-text as="h2" type="large" display="block">Heading level 2 (as="h2")</tct-text>
  <tct-text as="p" display="block">A paragraph of body text (as="p"). Screen readers announce it as a paragraph.</tct-text>
  <tct-text as="div" display="block" type="supporting">A div adds no role (as="div").</tct-text>
</div>
