<!-- title: Colours; description: Text colour roles. supporting defaults to secondary, everything else to primary.; a11y-exempt: color-contrast | The disabled role is shown as a colour swatch outside an inactive control; WCAG 1.4.3 exempts text of inactive user interface components, and this role is only meant for that use. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-1)">
  <tct-text color="primary" display="block">primary</tct-text>
  <tct-text color="secondary" display="block">secondary</tct-text>
  <tct-text color="accent" display="block">accent</tct-text>
  <tct-text color="disabled" display="block">disabled</tct-text>
  <tct-text type="supporting" display="block">supporting (secondary by default)</tct-text>
  <span style="color: var(--color-text-secondary)">Surrounding text, then <tct-text type="inherit">inherit takes its size and colour</tct-text>.</span>
</div>
