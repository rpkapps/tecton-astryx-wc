<!-- title: Weights and sizes; description: weight overrides the weight only and size the font size only. Prefer a type that already matches. -->
<tct-vstack gap="1">
  <tct-hstack gap="4">
    <tct-text weight="normal">normal</tct-text>
    <tct-text weight="medium">medium</tct-text>
    <tct-text weight="semibold">semibold</tct-text>
    <tct-text weight="bold">bold</tct-text>
  </tct-hstack>
  <tct-hstack gap="3" v-align="end">
    <tct-text size="xsm">xsm</tct-text>
    <tct-text size="sm">sm</tct-text>
    <tct-text size="base">base</tct-text>
    <tct-text size="lg">lg</tct-text>
    <tct-text size="xl">xl</tct-text>
    <tct-text size="2xl">2xl</tct-text>
  </tct-hstack>
</tct-vstack>
