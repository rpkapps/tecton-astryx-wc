<!-- title: Layout helpers; description: justify, text-wrap, strikethrough, tabular numbers and capsize (optical alignment). -->
<tct-vstack gap="3" width="320">
  <tct-text display="block" justify="center">Centred with justify</tct-text>
  <tct-text display="block" justify="end">End aligned (logical, follows the direction)</tct-text>
  <tct-text display="block" text-wrap="balance" type="large">Balanced wrapping spreads the words evenly across the lines it needs</tct-text>
  <tct-text has-strikethrough>Strikethrough</tct-text>
  <tct-vstack gap="0">
    <tct-text has-tabular-numbers display="block">1,111.11</tct-text>
    <tct-text has-tabular-numbers display="block">9,999.99</tct-text>
  </tct-vstack>
  <tct-hstack gap="2" v-align="center">
    <tct-icon name="search"></tct-icon>
    <tct-text has-capsize>Capsize trims the leading so text centres against the icon</tct-text>
  </tct-hstack>
</tct-vstack>
