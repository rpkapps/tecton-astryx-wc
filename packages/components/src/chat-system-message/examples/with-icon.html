<!-- title: With an icon; description: The icon slot puts a tct-icon before the text in the default variant. The text must carry the meaning: the icon is decoration. -->
<tct-vstack max-width="520" gap="2">
  <tct-chat-system-message><tct-icon slot="icon" name="success" color="success"></tct-icon>Work order WO-2291 created</tct-chat-system-message>
  <tct-chat-system-message><tct-icon slot="icon" name="warning" color="warning"></tct-icon>Compressor fault reported on C-19</tct-chat-system-message>
  <tct-chat-system-message><tct-icon slot="icon" name="clock"></tct-icon>Waiting for the operator to reply</tct-chat-system-message>
</tct-vstack>
