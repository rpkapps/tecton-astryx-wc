<!-- title: In a conversation; description: System messages between the messages of a list: a date break, then a notice. A list speaks a new system message once, by its text. -->
<tct-vstack max-width="520">
  <tct-chat-message-list align="top">
    <tct-chat-system-message variant="divider">Yesterday</tct-chat-system-message>
    <tct-chat-message sender="assistant">
      <tct-chat-message-bubble>The weekly production report is ready.</tct-chat-message-bubble>
    </tct-chat-message>
    <tct-chat-system-message variant="divider">Today</tct-chat-system-message>
    <tct-chat-system-message>Ana joined the chat</tct-chat-system-message>
    <tct-chat-message sender="user">
      <tct-chat-message-bubble>Can you summarize it?</tct-chat-message-bubble>
    </tct-chat-message>
  </tct-chat-message-list>
</tct-vstack>
