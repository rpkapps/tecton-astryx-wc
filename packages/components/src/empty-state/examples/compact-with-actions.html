<!-- title: Compact with actions; description: In the compact form the actions stack in a column. -->
<div style="max-inline-size: 260px; border: 1px solid var(--color-border); border-radius: var(--radius-container)">
  <tct-empty-state compact heading="No data" description="Add some data to get started.">
    <tct-button slot="actions" variant="secondary">Import</tct-button>
    <tct-button slot="actions" variant="primary">Add manually</tct-button>
  </tct-empty-state>
</div>
