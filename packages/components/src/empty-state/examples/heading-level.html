<!-- title: Heading level; description: The level only changes the document outline, never the visual size. Keep levels in order: a level 3 state, then a level 4 one nested under it. -->
<div style="display: flex; gap: var(--spacing-4); flex-wrap: wrap">
  <tct-empty-state heading="Level 3 title" heading-level="3" description="Semantic h3"></tct-empty-state>
  <tct-empty-state heading="Level 4 title" heading-level="4" description="Semantic h4"></tct-empty-state>
</div>
