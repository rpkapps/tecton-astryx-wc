<!-- title: With actions; description: Buttons give the user a next step. -->
<tct-empty-state
  heading="No results found"
  description="Try adjusting your search or filters."
>
  <tct-icon slot="icon" name="search" size="lg"></tct-icon>
  <tct-button slot="actions" variant="secondary">Go back</tct-button>
  <tct-button slot="actions" variant="primary">Clear filters</tct-button>
</tct-empty-state>
