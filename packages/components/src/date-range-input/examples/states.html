<!-- title: States; description: Hidden label, required and optional indicators, no clear button, disabled (with a reason), read-only, loading, sizes and a status. -->
<tct-vstack gap="4" max-width="420">
  <tct-date-range-input label="Label hidden but named" label-hidden></tct-date-range-input>
  <tct-date-range-input label="Required" required></tct-date-range-input>
  <tct-date-range-input label="Optional" optional label-tooltip="You can add this later."></tct-date-range-input>
  <tct-date-range-input label="No clear button" no-clear value="2026-03-02/2026-03-08"></tct-date-range-input>
  <tct-date-range-input label="Disabled with a reason" disabled disabled-message="Locked once the report is sent." value="2026-03-02/2026-03-08"></tct-date-range-input>
  <tct-date-range-input label="Read-only" readonly value="2026-03-02/2026-03-08"></tct-date-range-input>
  <tct-date-range-input label="Loading" loading value="2026-03-02/2026-03-08"></tct-date-range-input>
  <tct-date-range-input label="Small" size="sm" value="2026-03-02/2026-03-08"></tct-date-range-input>
  <tct-date-range-input label="Error" status-type="error" status-message="Pick a range in the past." value="2026-03-02/2026-03-08"></tct-date-range-input>
</tct-vstack>
