<!-- title: Page box; description: The input variant is "Page [ n ] / N": type a page and press Enter or leave the box. A number out of range is clamped, an empty or invalid entry goes back to the current page. First and last buttons flank previous and next; no-first-last removes them, and page-label renames the noun. -->
<tct-vstack gap="4">
  <tct-pagination label="Page box" variant="input" page="4" total-pages="24"></tct-pagination>
  <tct-pagination label="Row box" variant="input" page="4" total-pages="24" page-label="Row" no-first-last size="sm"></tct-pagination>
</tct-vstack>
