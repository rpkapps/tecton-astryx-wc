<!-- title: Sizes and states; description: Two sizes, a custom landmark name, the first and last page, and a disabled paginator. -->
<tct-vstack gap="4">
  <tct-pagination size="sm" page="5" total-pages="20" label="Results, small"></tct-pagination>
  <tct-pagination size="md" page="5" total-pages="20" label="Results, medium"></tct-pagination>
  <tct-pagination page="1" total-pages="8" label="First page"></tct-pagination>
  <tct-pagination page="8" total-pages="8" label="Last page"></tct-pagination>
  <tct-pagination page="3" total-pages="8" disabled label="Disabled"></tct-pagination>
</tct-vstack>
