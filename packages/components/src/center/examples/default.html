<!-- title: Default; description: Centres its content on both axes. Give the centre a height so there is room to centre in. -->
<tct-center height="160" style="background: var(--color-background-muted); border-radius: var(--radius-container)">
  <div style="padding: var(--spacing-3); background: var(--color-background-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-element)">Centered content</div>
</tct-center>
