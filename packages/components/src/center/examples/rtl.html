<!-- title: Right-to-left; description: Centring is symmetrical; logical padding follows the direction. -->
<tct-vstack id="rtl" gap="4">
  <div dir="ltr"><tct-card variant="muted" padding="0"><tct-center padding-inline-start="8"><span>ltr: padded on the left</span></tct-center></tct-card></div>
  <div dir="rtl"><tct-card variant="muted" padding="0"><tct-center padding-inline-start="8"><span>rtl: padded on the right</span></tct-center></tct-card></div>
</tct-vstack>
