<!-- title: Right-to-left; description: Centring is symmetrical; logical padding follows the direction. -->
<div id="rtl" style="display: grid; gap: var(--spacing-4)">
  <div dir="ltr"><tct-center padding-inline-start="8" style="background: var(--color-background-muted)"><span>ltr: padded on the left</span></tct-center></div>
  <div dir="rtl"><tct-center padding-inline-start="8" style="background: var(--color-background-muted)"><span>rtl: padded on the right</span></tct-center></div>
</div>
