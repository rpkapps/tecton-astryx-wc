<!-- title: Padding; description: padding takes a spacing step; padding-inline, padding-block and the four edges refine it. Centring happens inside the padding. -->
<div id="padding" style="display: flex; flex-wrap: wrap; gap: var(--spacing-4)">
  <tct-center padding="6" style="background: var(--color-background-muted)"><span>padding="6"</span></tct-center>
  <tct-center padding-inline="8" padding-block="2" style="background: var(--color-background-muted)"><span>inline 8, block 2</span></tct-center>
  <tct-center padding-block-start="8" padding-inline-end="6" style="background: var(--color-background-muted)"><span>per edge</span></tct-center>
</div>
