<!-- title: Wrapping; description: wrap="wrap" lets the row flow onto the next line in a narrow container. -->
<tct-hstack wrap="wrap" gap="2" max-width="300">
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Alpha</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Bravo</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Charlie</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Delta</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Echo</div>
</tct-hstack>
