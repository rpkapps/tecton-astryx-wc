<!-- title: Header row in a column; description: An hstack for a header row inside a vstack: a title that fills the row, and actions pinned to the end. -->
<tct-vstack gap="3" width="360" padding="3" style="border: var(--border-width) solid var(--color-border)">
  <tct-hstack v-align="center" gap="3">
    <tct-stack-item size="fill"><tct-text type="medium-strong">Project summary</tct-text></tct-stack-item>
    <span>Edit</span>
    <span>Share</span>
  </tct-hstack>
  <span>Body content follows the header row.</span>
</tct-vstack>
