<!-- title: In a form; description: The field submits HH:MM under its name, blocks a submit while a required value is missing (and only then shows the error), and is restored by reset. Enter commits the typed text and submits. -->
<tct-vstack max-width="420">
  <form id="in-form-root">
    <tct-form-layout>
      <tct-time-input label="Opens" name="opens" required min="06:00" max="12:00" description="Press Enter to submit."></tct-time-input>
      <tct-time-input label="Closes" name="closes" value="17:00" has-clear></tct-time-input>
      <tct-hstack gap="2">
        <tct-button type="submit" variant="primary">Save</tct-button>
        <tct-button type="reset">Reset</tct-button>
      </tct-hstack>
      <output></output>
    </tct-form-layout>
  </form>
</tct-vstack>
<script type="module">
  const form = document.getElementById('in-form-root');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    form.querySelector('output').textContent = JSON.stringify(Object.fromEntries(new FormData(form, event.submitter)));
  });
</script>
