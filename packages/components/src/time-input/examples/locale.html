<!-- title: Locale; description: The text is read and shown in the language of the nearest lang, including that language's digits and AM/PM markers. The value stays HH:MM with ASCII digits. -->
<tct-vstack gap="3" max-width="360">
  <div lang="en-GB"><tct-time-input label="Time (en-GB)" hour-format="24h" value="14:30"></tct-time-input></div>
  <div lang="de-DE"><tct-time-input label="Uhrzeit (de-DE)" hour-format="24h" value="14:30"></tct-time-input></div>
  <div lang="he-IL" dir="rtl"><tct-time-input label="שעה (he-IL)" hour-format="24h" value="14:30"></tct-time-input></div>
  <div lang="ar-SA" dir="rtl"><tct-time-input label="الوقت (ar-SA)" value="14:30"></tct-time-input></div>
</tct-vstack>
