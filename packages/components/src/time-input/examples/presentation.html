<!-- title: Presentation; description: The typed field, a bottom sheet with hour, minute and AM/PM columns, the browser's own time input, or the adaptive forms that switch with the device. The deprecated native-picker maps to the same values. -->
<tct-vstack gap="4" max-width="360">
  <tct-time-input label="text-input" presentation="text-input" value="14:30"></tct-time-input>
  <tct-time-input label="bottom-sheet" presentation="bottom-sheet" value="14:30"></tct-time-input>
  <tct-time-input label="native" presentation="native" value="14:30"></tct-time-input>
  <tct-time-input label="adaptive-bottom-sheet" presentation="adaptive-bottom-sheet" value="14:30"></tct-time-input>
  <tct-time-input label="adaptive-native (default)" value="14:30"></tct-time-input>
</tct-vstack>
