<!-- title: In a button group; description: A toggle button is a button: inside tct-button-group it joins the connected slab and the roving arrows, and its interior corners square from its position. -->
<tct-button-group label="Formatting">
  <tct-toggle-button label="Bold" pressed></tct-toggle-button>
  <tct-toggle-button label="Italic"></tct-toggle-button>
  <tct-toggle-button label="Underline"></tct-toggle-button>
</tct-button-group>
