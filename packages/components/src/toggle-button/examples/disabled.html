<!-- title: Disabled and loading; description: A disabled toggle cannot change; with a tooltip it stays focusable so the reason is reachable. A loading toggle shows a spinner and blocks activation. -->
<div style="display: flex; align-items: center; gap: var(--spacing-3)">
  <tct-toggle-button label="Disabled" disabled></tct-toggle-button>
  <tct-toggle-button label="Disabled, pressed" disabled pressed></tct-toggle-button>
  <tct-toggle-button label="With a reason" disabled tooltip="Available on the Pro plan"></tct-toggle-button>
  <tct-toggle-button label="Loading" loading></tct-toggle-button>
</div>
