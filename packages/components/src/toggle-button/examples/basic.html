<!-- title: Basic; description: A persistent on/off choice. pressed is the state (the attribute is the initial one); listen to tct-pressed-change, which is cancelable. -->
<tct-hstack id="basic-root" gap="3" v-align="center">
  <tct-toggle-button label="Bold" icon="check"></tct-toggle-button>
  <tct-toggle-button label="Italic" pressed></tct-toggle-button>
  <tct-text data-output color="secondary">Italic is on.</tct-text>
</tct-hstack>
<script type="module">
  const root = document.getElementById('basic-root');
  root.addEventListener('tct-pressed-change', (event) => {
    root.querySelector('[data-output]').textContent = `${event.target.label} would be ${event.pressed ? 'on' : 'off'}.`;
  });
</script>
