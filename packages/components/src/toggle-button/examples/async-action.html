<!-- title: API-backed toggle; description: pressedChangeAction runs after the change. The button flips at once, shows a spinner while the promise is pending, is interruptible, and restores the previous state if it rejects. -->
<div id="async-action" style="display: flex; align-items: center; gap: var(--spacing-3)">
  <tct-toggle-button label="Favourite"></tct-toggle-button>
  <tct-toggle-button label="Fails" ></tct-toggle-button>
  <span data-output style="color: var(--color-text-secondary)">Waiting.</span>
</div>
<script type="module">
  const root = document.getElementById('async-action');
  const output = root.querySelector('[data-output]');
  const [favourite, fails] = root.querySelectorAll('tct-toggle-button');
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  favourite.pressedChangeAction = async (pressed) => {
    await wait(800);
    output.textContent = `Saved: ${pressed}.`;
  };
  fails.pressedChangeAction = async () => {
    await wait(800);
    output.textContent = 'The request failed; the button went back.';
    throw new Error('request failed');
  };
  window.addEventListener('unhandledrejection', (event) => event.preventDefault());
</script>
