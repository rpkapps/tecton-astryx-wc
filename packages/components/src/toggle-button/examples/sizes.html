<!-- title: Sizes; description: Small, medium (default) and large; a member's own size wins over its group's. -->
<div style="display: flex; align-items: center; gap: var(--spacing-3)">
  <tct-toggle-button size="sm" label="Small" pressed></tct-toggle-button>
  <tct-toggle-button label="Medium" pressed></tct-toggle-button>
  <tct-toggle-button size="lg" label="Large" pressed></tct-toggle-button>
</div>
