<!-- title: Navigable; description: With navigable, enabled steps are buttons. A click asks to activate that step through the cancelable tct-value-change and the stepper applies it (set active-step yourself and preventDefault() for a controlled flow). Disabled steps stay text. -->
<div id="navigable-root">
  <tct-vstack gap="3">
    <tct-stepper active-step="1" navigable>
      <tct-step label="Account"></tct-step>
      <tct-step label="Profile"></tct-step>
      <tct-step label="Payment"></tct-step>
      <tct-step label="Confirmation" disabled></tct-step>
    </tct-stepper>
    <tct-text color="secondary" data-output>Active step: 2 (Profile)</tct-text>
  </tct-vstack>
  <script type="module">
    const root = document.querySelector('#navigable-root');
    const stepper = root.querySelector('tct-stepper');
    const labels = [...stepper.querySelectorAll('tct-step')].map((step) => step.label);
    stepper.addEventListener('tct-value-change', (event) => {
      root.querySelector('[data-output]').textContent = `Active step: ${event.value + 1} (${labels[event.value]})`;
    });
  </script>
</div>
