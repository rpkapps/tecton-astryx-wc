<!-- title: Basic; description: Steps show progress against active-step (zero-based): completed steps get a check, the active one a ring, the rest a number. The list is labelled and the active step is aria-current="step". -->
<tct-stepper active-step="1">
  <tct-step label="Account" description="Sign in or register"></tct-step>
  <tct-step label="Profile" description="Tell us about you"></tct-step>
  <tct-step label="Payment"></tct-step>
  <tct-step label="Review"></tct-step>
</tct-stepper>
