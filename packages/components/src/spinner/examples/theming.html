<!-- title: Theming; description: The public custom properties re-theme diameter, stroke, colours and how much of the ring the arc covers. Lengths need units. -->
<div style="display: flex; align-items: center; gap: var(--spacing-6)">
  <tct-spinner size="xl" style="--spinner-diameter: 40px; --spinner-stroke-width: 5px"></tct-spinner>
  <tct-spinner size="xl" style="--spinner-color: var(--color-error); --spinner-track-color: transparent"></tct-spinner>
  <tct-spinner size="xl" style="--spinner-arc-fraction: 0.75"></tct-spinner>
</div>
