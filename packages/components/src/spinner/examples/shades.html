<!-- title: Shades; description: default, subtle, on-media (for dark or accent backgrounds) and inherit (the surrounding colour). -->
<div style="display: flex; align-items: center; gap: var(--spacing-5)">
  <tct-spinner size="lg" shade="default"></tct-spinner>
  <tct-spinner size="lg" shade="subtle"></tct-spinner>
  <span style="display: inline-flex; padding: var(--spacing-3); background: var(--color-on-light); color: var(--color-on-dark)">
    <tct-spinner size="lg" shade="on-media"></tct-spinner>
  </span>
  <span style="display: inline-flex; padding: var(--spacing-3); background: var(--color-accent); color: var(--color-on-accent)">
    <tct-spinner size="lg" shade="inherit"></tct-spinner>
  </span>
</div>
