<!-- title: Labelled; description: A visible label names the spinner. Rich content goes in the slot; an aria-label names a spinner without text. -->
<div style="display: flex; align-items: flex-start; gap: var(--spacing-8)">
  <tct-spinner size="lg" label="Loading data..."></tct-spinner>
  <tct-spinner size="lg" aria-label="Fetching results">
    <span><strong>Fetching results</strong><br />This may take a moment</span>
  </tct-spinner>
  <tct-spinner size="lg" aria-label="Saving"></tct-spinner>
</div>
