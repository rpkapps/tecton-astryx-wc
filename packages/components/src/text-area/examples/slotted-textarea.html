<!-- title: Slotted textarea; description: Slot your own native textarea so browser features and autofill see a real field. The label, description and status are wired next to it. -->
<tct-text-area label="Message" description="We reply within a day." status-type="warning" status-message="Do not include passwords.">
  <textarea slot="input" name="message" rows="4">Hello</textarea>
</tct-text-area>
