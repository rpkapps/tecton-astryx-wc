<!-- title: Sizes; description: size sets the inner padding; rows sets the visible height. -->
<tct-vstack gap="4">
  <tct-text-area label="Small" size="sm" rows="2"></tct-text-area>
  <tct-text-area label="Medium (default)" rows="3"></tct-text-area>
  <tct-text-area label="Large" size="lg" rows="4"></tct-text-area>
</tct-vstack>
