<!-- title: Right to left; description: In right-to-left text the start panel is on the right, dragging towards it makes it wider and the right arrow makes it narrower. The grip is mirrored. -->
<div dir="rtl">
  <tct-card padding="0" height="220">
    <tct-layout padding="4">
      <tct-layout-panel slot="start" resizable default-size="200" min-size="120" max-size="320" landmark="complementary" label="الشريط الجانبي"><tct-text>الشريط الجانبي</tct-text></tct-layout-panel>
      <tct-resize-handle slot="start" has-divider label="تغيير حجم الشريط الجانبي"></tct-resize-handle>
      <tct-layout-content><tct-text>المحتوى</tct-text></tct-layout-content>
    </tct-layout>
  </tct-card>
</div>
