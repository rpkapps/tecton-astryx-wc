<!-- title: Disabled and hover-only grip; description: A disabled handle takes no focus and no input. no-always-visible shows the grip pill only on hover and focus, and without has-divider the handle is only the grab zone. -->
<tct-vstack gap="4">
  <tct-card padding="0" height="160">
    <tct-layout padding="4">
      <tct-layout-panel slot="start" resizable default-size="200" min-size="120" max-size="320" landmark="complementary" label="Locked sidebar"><tct-text>Locked</tct-text></tct-layout-panel>
      <tct-resize-handle slot="start" disabled has-divider label="Resize locked sidebar"></tct-resize-handle>
      <tct-layout-content><tct-text>Disabled handle</tct-text></tct-layout-content>
    </tct-layout>
  </tct-card>
  <tct-card padding="0" height="160">
    <tct-layout padding="4">
      <tct-layout-panel slot="start" resizable default-size="200" min-size="120" max-size="320" landmark="complementary" label="Hover sidebar"><tct-text>Hover the divider</tct-text></tct-layout-panel>
      <tct-resize-handle slot="start" no-always-visible has-divider label="Resize hover sidebar"></tct-resize-handle>
      <tct-layout-content><tct-text>Grip shown on hover</tct-text></tct-layout-content>
    </tct-layout>
  </tct-card>
</tct-vstack>
