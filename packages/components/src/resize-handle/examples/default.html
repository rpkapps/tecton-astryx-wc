<!-- title: Default; description: A handle after a resizable start panel. It is a separator you can focus: the arrow keys resize by 10 px (50 px with Shift), Home and End go to the smallest and the largest size, and the value is announced. The pointer drags it. -->
<tct-card padding="0" height="220">
  <tct-layout padding="4">
    <tct-layout-panel slot="start" resizable default-size="200" min-size="120" max-size="320" landmark="complementary" label="Sidebar">
      <tct-text>Sidebar</tct-text>
    </tct-layout-panel>
    <tct-resize-handle slot="start" has-divider label="Resize sidebar"></tct-resize-handle>
    <tct-layout-content><tct-text>Content</tct-text></tct-layout-content>
  </tct-layout>
</tct-card>
