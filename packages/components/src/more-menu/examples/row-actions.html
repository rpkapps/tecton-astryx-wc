<!-- title: Row actions; description: The overflow menu at the end of a row, the usual home of secondary actions. Compound rows work too: children of the menu are its rows. -->
<tct-card padding="3">
  <tct-hstack h-align="between" v-align="center">
    <tct-text weight="medium">Quarterly report.pdf</tct-text>
    <tct-more-menu label="Report actions">
      <tct-dropdown-menu-item label="Rename"></tct-dropdown-menu-item>
      <tct-dropdown-menu-item label="Download"></tct-dropdown-menu-item>
      <tct-dropdown-menu-divider></tct-dropdown-menu-divider>
      <tct-dropdown-menu-item label="Delete" variant="destructive"></tct-dropdown-menu-item>
    </tct-more-menu>
  </tct-hstack>
</tct-card>
