<!-- title: Pulsing; description: Pulse only states that need attention, such as a live connection. The pulse stops under reduced motion. -->
<tct-hstack gap="2" v-align="center">
  <tct-status-dot variant="success" label="Live" pulsing></tct-status-dot>
  <tct-text>Live</tct-text>
  <tct-status-dot variant="error" label="Recording failed" pulsing></tct-status-dot>
  <tct-text>Recording failed</tct-text>
</tct-hstack>
