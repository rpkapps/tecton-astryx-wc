<!-- title: Sizes; description: size is sm, md or lg. The field and the result rows follow it; unset, the field takes the nearest size provider. -->
<tct-vstack id="sizes-root" max-width="360" gap="4">
  <tct-typeahead label="Small" size="sm" placeholder="Search fruit"></tct-typeahead>
  <tct-typeahead label="Medium" size="md" placeholder="Search fruit"></tct-typeahead>
  <tct-typeahead label="Large" size="lg" placeholder="Search fruit"></tct-typeahead>
</tct-vstack>
<script type="module">
  import {createStaticSource} from '@tecton-wc/components/typeahead/utils.js';

  const fruits = [
    {id: 'apple', label: 'Apple'},
    {id: 'apricot', label: 'Apricot'},
    {id: 'banana', label: 'Banana'},
    {id: 'blueberry', label: 'Blueberry'},
    {id: 'cherry', label: 'Cherry'},
    {id: 'grape', label: 'Grape'},
    {id: 'lemon', label: 'Lemon'},
    {id: 'mango', label: 'Mango'},
    {id: 'peach', label: 'Peach'},
  ];
  for (const field of document.querySelectorAll('#sizes-root tct-typeahead')) field.searchSource = createStaticSource(fruits);
</script>
