<!-- title: States; description: A chosen item (defaultItem), required and optional, no-clear, disabled with a reason that keeps the field focusable, read-only, and loading. -->
<tct-vstack id="states-root" max-width="360" gap="4">
  <tct-typeahead label="Chosen" id="states-chosen"></tct-typeahead>
  <tct-typeahead label="Required" required placeholder="Search fruit"></tct-typeahead>
  <tct-typeahead label="Optional, no clear button" optional no-clear id="states-no-clear"></tct-typeahead>
  <tct-typeahead label="Disabled with a reason" disabled disabled-message="Fruit is chosen by your manager." id="states-disabled"></tct-typeahead>
  <tct-typeahead label="Read-only" readonly id="states-readonly"></tct-typeahead>
  <tct-typeahead label="Loading" loading placeholder="Search fruit"></tct-typeahead>
</tct-vstack>
<script type="module">
  import {createStaticSource} from '@tecton-wc/components/typeahead/utils.js';

  const fruits = [
    {id: 'apple', label: 'Apple'},
    {id: 'apricot', label: 'Apricot'},
    {id: 'banana', label: 'Banana'},
    {id: 'blueberry', label: 'Blueberry'},
    {id: 'cherry', label: 'Cherry'},
    {id: 'grape', label: 'Grape'},
    {id: 'lemon', label: 'Lemon'},
    {id: 'mango', label: 'Mango'},
    {id: 'peach', label: 'Peach'},
  ];
  for (const field of document.querySelectorAll('#states-root tct-typeahead')) field.searchSource = createStaticSource(fruits);
  document.getElementById('states-chosen').item = fruits[2];
  document.getElementById('states-no-clear').item = fruits[4];
  document.getElementById('states-disabled').item = fruits[6];
  document.getElementById('states-readonly').item = fruits[7];
</script>
