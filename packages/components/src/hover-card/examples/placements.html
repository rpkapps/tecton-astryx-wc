<!-- title: Placement and alignment; description: The four placements. Cards flip when they do not fit; start and end mirror in RTL. -->
<tct-hstack wrap="wrap" gap="4" padding-block="10" padding-inline="8">
  <tct-hover-card placement="above" alignment="center"><button type="button">Above</button><div slot="content">Above, centred.</div></tct-hover-card>
  <tct-hover-card placement="below" alignment="start"><button type="button">Below</button><div slot="content">Below, start-aligned.</div></tct-hover-card>
  <tct-hover-card placement="start" alignment="center"><button type="button">Start</button><div slot="content">Start side.</div></tct-hover-card>
  <tct-hover-card placement="end" alignment="end"><button type="button">End</button><div slot="content">End side, end-aligned.</div></tct-hover-card>
</tct-hstack>
