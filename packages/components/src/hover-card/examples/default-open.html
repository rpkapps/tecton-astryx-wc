<!-- title: Open on load; description: The open attribute shows the card when it renders. It stays dismissible with Escape or an outside press. -->
<tct-vstack h-align="start" padding-block-start="10">
  <tct-hover-card open label="Tip">
    <button type="button">Trigger</button>
    <div slot="content">Open on load. Press Escape to dismiss it.</div>
  </tct-hover-card>
</tct-vstack>
