<!-- title: Link; description: href makes the token a link with the same URL policy, target and rel rules as tct-link. A linked token can also be removable; the whole pill follows the link except over the remove button. -->
<tct-hstack wrap="wrap" gap="2" v-align="center">
  <tct-token label="Documentation" href="https://example.com/docs" color="blue"></tct-token>
  <tct-token label="Changelog" href="https://example.com/changes" target="_blank" color="green"></tct-token>
  <tct-token label="Saved search" href="https://example.com/search?q=open" removable></tct-token>
</tct-hstack>
