<!-- title: Sizes; description: size is sm, md or lg. Unset, a token follows the nearest size provider (md by default). -->
<tct-hstack wrap="wrap" gap="2" v-align="center">
  <tct-token label="Small" size="sm" removable></tct-token>
  <tct-token label="Medium" size="md" removable></tct-token>
  <tct-token label="Large" size="lg" removable></tct-token>
</tct-hstack>
