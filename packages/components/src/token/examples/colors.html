<!-- title: Colors; description: color takes the neutral default or one of ten tinted hues. Use two or three meaningful colours per group so the tokens stay scannable. -->
<tct-hstack wrap="wrap" gap="2" v-align="center">
  <tct-token label="Default"></tct-token>
  <tct-token label="Red" color="red"></tct-token>
  <tct-token label="Orange" color="orange"></tct-token>
  <tct-token label="Yellow" color="yellow"></tct-token>
  <tct-token label="Green" color="green"></tct-token>
  <tct-token label="Teal" color="teal"></tct-token>
  <tct-token label="Cyan" color="cyan"></tct-token>
  <tct-token label="Blue" color="blue"></tct-token>
  <tct-token label="Purple" color="purple"></tct-token>
  <tct-token label="Pink" color="pink"></tct-token>
  <tct-token label="Gray" color="gray"></tct-token>
</tct-hstack>
