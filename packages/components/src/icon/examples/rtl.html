<!-- title: Right-to-left; description: Directional glyphs (chevrons, arrows) mirror when the direction is rtl. Others stay as drawn. -->
<div style="display: flex; gap: var(--spacing-8)">
  <div dir="ltr" style="display: flex; align-items: center; gap: var(--spacing-3)">
    ltr <tct-icon name="chevronRight"></tct-icon> <tct-icon name="search"></tct-icon>
  </div>
  <div dir="rtl" style="display: flex; align-items: center; gap: var(--spacing-3)">
    rtl <tct-icon name="chevronRight"></tct-icon> <tct-icon name="search"></tct-icon>
  </div>
</div>
