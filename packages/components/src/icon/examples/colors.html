<!-- title: Colours; description: Colour variants map to the icon, status and hue roles. inherit follows the text colour. -->
<tct-hstack wrap="wrap" gap="4" v-align="center">
  <tct-icon name="info" color="inherit"></tct-icon>
  <tct-icon name="info" color="primary"></tct-icon>
  <tct-icon name="info" color="secondary"></tct-icon>
  <tct-icon name="info" color="disabled"></tct-icon>
  <tct-icon name="info" color="accent"></tct-icon>
  <tct-icon name="success" color="success"></tct-icon>
  <tct-icon name="error" color="error"></tct-icon>
  <tct-icon name="warning" color="warning"></tct-icon>
  <tct-icon name="info" color="blue"></tct-icon>
  <tct-icon name="info" color="teal"></tct-icon>
  <tct-icon name="info" color="orange"></tct-icon>
  <tct-icon name="info" color="purple"></tct-icon>
</tct-hstack>
