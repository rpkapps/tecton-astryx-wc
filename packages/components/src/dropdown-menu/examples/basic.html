<!-- title: Basic; description: A trigger button opens a menu of actions. In compound mode the rows are children of the menu. Enter, Space or ArrowDown on the trigger opens it and focuses the first row. -->
<tct-dropdown-menu label="Actions">
  <tct-dropdown-menu-item label="Edit project" icon="wrench"></tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Duplicate project" icon="copy"></tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Share project" icon="externalLink"></tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Archive project" icon="stop"></tct-dropdown-menu-item>
</tct-dropdown-menu>
