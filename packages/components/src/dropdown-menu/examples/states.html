<!-- title: Destructive, disabled and staying open; description: A destructive row is drawn in the error colour. Disabled rows stay focusable so they can be discovered, but cannot be activated. no-close-on-select keeps the menu open, for a row that reports its result on itself. -->
<tct-dropdown-menu label="Row actions">
  <tct-dropdown-menu-item label="Rename" icon="wrench"></tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Copy link" icon="copy" no-close-on-select></tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Move to trash (needs permission)" disabled></tct-dropdown-menu-item>
  <tct-dropdown-menu-divider></tct-dropdown-menu-divider>
  <tct-dropdown-menu-item label="Delete" variant="destructive" icon="stop"></tct-dropdown-menu-item>
</tct-dropdown-menu>
