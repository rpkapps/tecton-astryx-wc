<!-- title: Descriptions and shortcuts; description: A row can carry a description below its label and trailing content such as a keyboard-shortcut hint in the end slot. -->
<tct-dropdown-menu label="File" variant="primary">
  <tct-dropdown-menu-item label="Open" description="Open a file from disk" icon="externalLink">
    <tct-text slot="end" color="secondary">Ctrl+O</tct-text>
  </tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Duplicate" description="Make a copy of this file" icon="copy">
    <tct-text slot="end" color="secondary">Ctrl+D</tct-text>
  </tct-dropdown-menu-item>
  <tct-dropdown-menu-item label="Find in file" icon="search">
    <tct-text slot="end" color="secondary">Ctrl+F</tct-text>
  </tct-dropdown-menu-item>
</tct-dropdown-menu>
