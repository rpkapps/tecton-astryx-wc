<!-- title: States; description: Hidden label, required and optional indicators, a start icon, disabled (with a reason), read-only (no stepping) and loading. -->
<tct-vstack gap="4">
  <tct-number-input label="Label hidden but named" label-hidden placeholder="Label hidden but named"></tct-number-input>
  <tct-number-input label="Required" required></tct-number-input>
  <tct-number-input label="Optional" optional label-tooltip="You can add this later."></tct-number-input>
  <tct-number-input label="With an icon" start-icon="search" placeholder="Search by number"></tct-number-input>
  <tct-number-input label="Disabled" disabled value="5"></tct-number-input>
  <tct-number-input label="Disabled with a reason" disabled disabled-message="Locked while the order is processing." value="5"></tct-number-input>
  <tct-number-input label="Read-only" readonly has-steppers value="5"></tct-number-input>
  <tct-number-input label="Loading" loading value="5"></tct-number-input>
</tct-vstack>
