<!-- title: In a form; description: The field submits the plain number under its name, blocks a submit while a required value is missing (and only then shows the error), and is restored by reset. Enter commits and submits. -->
<!-- layout: pending tct-stack -->
<form id="in-form-number-example">
  <tct-number-input label="Quantity" name="quantity" required min="1" max="99" description="Press Enter to submit."></tct-number-input>
  <tct-number-input label="Discount" name="discount" units="%" value="10" min="0" max="100" has-steppers></tct-number-input>
  <tct-button type="submit" variant="primary">Save</tct-button>
  <tct-button type="reset">Reset</tct-button>
  <output></output>
</form>
<script type="module">
  const form = document.getElementById('in-form-number-example');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    form.querySelector('output').textContent = JSON.stringify(Object.fromEntries(new FormData(form, event.submitter)));
  });
</script>
