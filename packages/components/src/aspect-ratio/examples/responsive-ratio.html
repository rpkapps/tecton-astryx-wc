<!-- title: Responsive ratio; description: Change the ratio at a breakpoint by overriding aspect-ratio on the part from your own CSS. Resize the window to see the box change from 16:9 to 4:3. -->
<style>
  #responsive-ratio tct-aspect-ratio::part(base) {
    aspect-ratio: 16 / 9;
  }
  @media (max-width: 40rem) {
    #responsive-ratio tct-aspect-ratio::part(base) {
      aspect-ratio: 4 / 3;
    }
  }
</style>
<div id="responsive-ratio" style="max-inline-size: 420px">
  <tct-aspect-ratio ratio="16/9">
    <div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-background-muted)">16:9, 4:3 on narrow screens</div>
  </tct-aspect-ratio>
</div>
