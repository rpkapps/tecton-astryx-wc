<!-- title: Responsive ratio; description: Change the ratio at a breakpoint by overriding aspect-ratio on the part from your own CSS. Resize the window to see the box change from 16:9 to 4:3. -->
<style>
  #responsive-ratio tct-aspect-ratio::part(base) {
    aspect-ratio: 16 / 9;
  }
  @media (max-width: 40rem) {
    #responsive-ratio tct-aspect-ratio::part(base) {
      aspect-ratio: 4 / 3;
    }
  }
</style>
<tct-vstack id="responsive-ratio" max-width="420">
  <tct-aspect-ratio ratio="16/9">
    <tct-card variant="muted" padding="0" height="100%"><tct-center height="100%">16:9, 4:3 on narrow screens</tct-center></tct-card>
  </tct-aspect-ratio>
</tct-vstack>
