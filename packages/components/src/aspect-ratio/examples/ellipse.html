<!-- title: Ellipse; description: shape="ellipse" clips the box to an ellipse that follows the ratio: a circle at 1:1, an oval otherwise. -->
<div id="ellipse" style="display: flex; align-items: flex-start; gap: var(--spacing-6)">
  <div style="inline-size: 120px"><tct-aspect-ratio ratio="1" shape="ellipse"><div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-neutral)">circle</div></tct-aspect-ratio></div>
  <div style="inline-size: 200px"><tct-aspect-ratio ratio="2" shape="ellipse"><div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-neutral)">oval</div></tct-aspect-ratio></div>
</div>
