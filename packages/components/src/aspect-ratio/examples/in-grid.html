<!-- title: Thumbnails in a grid; description: A responsive grid of same-shaped tiles: each tile is a 4:3 box, so the rows stay even at any width. -->
<tct-grid column-min-width="120" gap="3">
  <tct-aspect-ratio ratio="4/3"><tct-card variant="muted" padding="0" height="100%"><tct-center height="100%">1</tct-center></tct-card></tct-aspect-ratio>
  <tct-aspect-ratio ratio="4/3"><tct-card variant="muted" padding="0" height="100%"><tct-center height="100%">2</tct-center></tct-card></tct-aspect-ratio>
  <tct-aspect-ratio ratio="4/3"><tct-card variant="muted" padding="0" height="100%"><tct-center height="100%">3</tct-center></tct-card></tct-aspect-ratio>
  <tct-aspect-ratio ratio="4/3"><tct-card variant="muted" padding="0" height="100%"><tct-center height="100%">4</tct-center></tct-card></tct-aspect-ratio>
</tct-grid>
