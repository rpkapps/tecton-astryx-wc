<!-- title: Thumbnails in a grid; description: A responsive grid of same-shaped tiles: each tile is a 4:3 box, so the rows stay even at any width. -->
<tct-grid column-min-width="120" gap="3">
  <tct-aspect-ratio ratio="4/3"><div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-background-muted)">1</div></tct-aspect-ratio>
  <tct-aspect-ratio ratio="4/3"><div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-background-muted)">2</div></tct-aspect-ratio>
  <tct-aspect-ratio ratio="4/3"><div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-background-muted)">3</div></tct-aspect-ratio>
  <tct-aspect-ratio ratio="4/3"><div style="inline-size: 100%; block-size: 100%; display: grid; place-items: center; background: var(--color-background-muted)">4</div></tct-aspect-ratio>
</tct-grid>
