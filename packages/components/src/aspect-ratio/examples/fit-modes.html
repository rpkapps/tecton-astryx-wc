<!-- title: Fit modes; description: fit="cover" fills and crops, "contain" fills and letterboxes, "center" keeps the natural size. The svg stands in for an image. -->
<tct-grid id="fit-modes" columns="3" gap="4" max-width="540">
  <tct-vstack gap="2">
    <p>cover</p>
    <tct-card variant="muted" padding="0">
      <tct-aspect-ratio ratio="1" fit="cover">
        <svg viewBox="0 0 40 20" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A wide picture"><rect width="40" height="20" fill="currentColor" opacity="0.25"/><circle cx="20" cy="10" r="8" fill="currentColor"/></svg>
      </tct-aspect-ratio>
    </tct-card>
  </tct-vstack>
  <tct-vstack gap="2">
    <p>contain</p>
    <tct-card variant="muted" padding="0">
      <tct-aspect-ratio ratio="1" fit="contain">
        <svg viewBox="0 0 40 20" role="img" aria-label="A wide picture"><rect width="40" height="20" fill="currentColor" opacity="0.25"/><circle cx="20" cy="10" r="8" fill="currentColor"/></svg>
      </tct-aspect-ratio>
    </tct-card>
  </tct-vstack>
  <tct-vstack gap="2">
    <p>center</p>
    <tct-card variant="muted" padding="0">
      <tct-aspect-ratio ratio="1" fit="center">
        <span>natural size</span>
      </tct-aspect-ratio>
    </tct-card>
  </tct-vstack>
</tct-grid>
