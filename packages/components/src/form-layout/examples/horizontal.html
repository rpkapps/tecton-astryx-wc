<!-- title: Horizontal; description: direction="horizontal" puts the fields side by side in equal columns. Use it for fields that belong together. -->
<form id="horizontal" onsubmit="return false" style="max-inline-size: 480px">
  <tct-form-layout direction="horizontal">
    <div style="display: grid; gap: var(--spacing-1)"><label for="horizontal-first">First name</label><input id="horizontal-first" name="first" autocomplete="given-name" /></div>
    <div style="display: grid; gap: var(--spacing-1)"><label for="horizontal-last">Last name</label><input id="horizontal-last" name="last" autocomplete="family-name" /></div>
  </tct-form-layout>
</form>
