<!-- title: Horizontal labels; description: horizontal-labels puts each label in a first column and its control in a second. It collapses to one column at 480px and below. -->
<form id="horizontal-labels" onsubmit="return false" style="max-inline-size: 480px">
  <tct-form-layout direction="horizontal-labels">
    <label for="hl-name">Name</label><input id="hl-name" name="name" autocomplete="name" />
    <label for="hl-email">Email address</label><input id="hl-email" name="email" type="email" autocomplete="email" />
    <label for="hl-org">Organisation</label><input id="hl-org" name="org" autocomplete="organization" />
  </tct-form-layout>
</form>
