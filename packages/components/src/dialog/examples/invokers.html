<!-- title: Declarative invokers; description: A native button with commandfor and command="--show", "--hide" or "--toggle" controls the dialog with no script. The button gets aria-expanded, and focus returns to it. -->
<button type="button" commandfor="invokers-dialog" command="--show">Open dialog</button>
<tct-dialog id="invokers-dialog" heading="Invited by a button">
  <tct-text as="p" display="block">No script wires this dialog: the buttons carry commandfor and command.</tct-text>
  <tct-hstack h-align="end">
    <button type="button" commandfor="invokers-dialog" command="--hide">Close</button>
  </tct-hstack>
</tct-dialog>
