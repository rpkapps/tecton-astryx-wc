<!-- title: Basic; description: The heading names the dialog and takes focus; Escape and a press on the backdrop close it, and focus returns to the button that opened it. -->
<div id="basic-example">
  <tct-button variant="primary" data-open>Open dialog</tct-button>
  <tct-dialog heading="Delete survey?" subtitle="This cannot be undone.">
    <tct-text as="p" display="block">The survey and its 12 attached logs will be removed from the project.</tct-text>
    <tct-hstack gap="2" h-align="end">
      <tct-button data-close>Cancel</tct-button>
      <tct-button variant="destructive" data-close>Delete</tct-button>
    </tct-hstack>
  </tct-dialog>
</div>
<script type="module">
  const root = document.getElementById('basic-example');
  const dialog = root.querySelector('tct-dialog');
  root.querySelector('[data-open]').addEventListener('click', () => dialog.show());
  for (const button of root.querySelectorAll('[data-close]')) {
    button.addEventListener('click', () => dialog.requestClose());
  }
</script>
