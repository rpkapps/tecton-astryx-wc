<!-- title: Composed header; description: Compose tct-dialog-header for start and end content, a divider or your own heading element. inline shows a dialog in place, for previews. -->
<tct-dialog inline open>
  <tct-dialog-header heading="Well log" subtitle="North-7, run 3" has-divider>
    <tct-button slot="start" variant="ghost" icon="chevronLeft" icon-only label="Back"></tct-button>
    <tct-button slot="end" size="sm">Export</tct-button>
  </tct-dialog-header>
  <tct-text as="p" display="block">The header names the dialog, holds start and end content, and shows the close button.</tct-text>
</tct-dialog>
