<!-- title: Start and end panels; description: Panels sit in the start and end slots and are logical: they swap in right-to-left text. width sets the panel width, no-scroll turns the panel scrolling off, and a panel without a divider keeps its width. -->
<tct-vstack gap="4">
  <tct-card padding="0" height="200">
    <tct-layout padding="4">
      <tct-layout-panel slot="start" has-divider width="160" landmark="complementary" label="Start panel"><tct-text>Start panel</tct-text></tct-layout-panel>
      <tct-layout-content><tct-text>Content</tct-text></tct-layout-content>
      <tct-layout-panel slot="end" has-divider width="160" landmark="complementary" label="End panel"><tct-text>End panel</tct-text></tct-layout-panel>
    </tct-layout>
  </tct-card>
  <tct-card padding="0" height="200">
    <tct-layout padding="4">
      <tct-layout-panel slot="start" width="160" landmark="complementary" label="Panel without a divider"><tct-text>No divider</tct-text></tct-layout-panel>
      <tct-layout-content><tct-text>The panel has no divider and keeps its width.</tct-text></tct-layout-content>
    </tct-layout>
  </tct-card>
</tct-vstack>
