<!-- title: Landmarks and names; description: A region is a plain box until you give it a landmark. landmark takes the ARIA role and label names it; set both together, and give each landmark of a kind on a page its own name. Use banner, main and contentinfo only for the regions of the whole page (tct-app-shell does that for you); inside a page use navigation, complementary or region. -->
<tct-card padding="0" height="240">
  <tct-layout padding="4">
    <tct-layout-header slot="header" has-divider><tct-text type="medium-strong">Project</tct-text></tct-layout-header>
    <tct-layout-panel slot="start" has-divider width="160" landmark="navigation" label="Project sections"><tct-text>Sections</tct-text></tct-layout-panel>
    <tct-layout-content landmark="region" label="Project details"><tct-text>Details</tct-text></tct-layout-content>
    <tct-layout-panel slot="end" has-divider width="140" landmark="complementary" label="Project activity"><tct-text>Activity</tct-text></tct-layout-panel>
    <tct-layout-footer slot="footer" has-divider><tct-text>Footer</tct-text></tct-layout-footer>
  </tct-layout>
</tct-card>
