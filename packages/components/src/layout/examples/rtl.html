<!-- title: Right to left; description: The start panel is on the right in right-to-left text, the end panel on the left, and the dividers and the padding follow. -->
<div dir="rtl">
  <tct-card padding="0" height="220">
    <tct-layout padding="4">
      <tct-layout-header slot="header" has-divider><tct-text type="medium-strong">الإعدادات</tct-text></tct-layout-header>
      <tct-layout-panel slot="start" has-divider width="150" landmark="complementary" label="البداية"><tct-text>لوحة البداية</tct-text></tct-layout-panel>
      <tct-layout-content><tct-text>المحتوى</tct-text></tct-layout-content>
      <tct-layout-panel slot="end" has-divider width="150" landmark="complementary" label="النهاية"><tct-text>لوحة النهاية</tct-text></tct-layout-panel>
    </tct-layout>
  </tct-card>
</div>
