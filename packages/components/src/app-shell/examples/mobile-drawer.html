<!-- title: Mobile drawer; description: Below the breakpoint the side navigation becomes a drawer opened by the toggle. mobile-nav-breakpoint names the width: sm, md (default), lg, xl or 2xl. It is raised to 2xl here so that the drawer applies on most screens. -->
<tct-app-shell mobile-nav-breakpoint="2xl" no-landmarks style="--app-shell-height: 320px">
  <tct-hstack slot="top-nav" padding="2" gap="2" v-align="center">
    <tct-mobile-nav-toggle></tct-mobile-nav-toggle>
    <tct-text type="medium-strong">Acme</tct-text>
  </tct-hstack>
  <nav slot="side-nav" aria-label="Sections">
    <tct-vstack gap="1" padding="2">
      <a href="#overview">Overview</a>
      <a href="#projects">Projects</a>
      <a href="#reports">Reports</a>
      <a href="#settings">Settings</a>
    </tct-vstack>
  </nav>
  <tct-vstack padding="4" gap="2">
    <tct-text type="medium-strong">Overview</tct-text>
    <tct-text as="p">The main content. The skip link in front of the page moves focus here.</tct-text>
  </tct-vstack>
</tct-app-shell>
