<!-- title: Staggered wave; description: Sequential index values start each skeleton's pulse 100 ms after the previous one. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-2); max-inline-size: 320px">
  <tct-skeleton height="16" index="0"></tct-skeleton>
  <tct-skeleton height="16" index="1"></tct-skeleton>
  <tct-skeleton height="16" index="2"></tct-skeleton>
  <tct-skeleton height="16" index="3"></tct-skeleton>
</div>
