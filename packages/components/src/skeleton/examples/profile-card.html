<!-- title: Loading card; description: A card-shaped loading state; the busy region carries aria-busy. -->
<tct-card max-width="280">
  <tct-vstack as="section" aria-busy="true" aria-label="Profile" gap="3">
    <tct-hstack gap="3" v-align="center">
      <tct-skeleton width="40" height="40" radius="rounded"></tct-skeleton>
      <tct-stack-item size="fill">
        <tct-vstack gap="1">
          <tct-skeleton height="14" index="1"></tct-skeleton>
          <tct-skeleton width="60%" height="12" index="2"></tct-skeleton>
        </tct-vstack>
      </tct-stack-item>
    </tct-hstack>
    <tct-skeleton height="12" index="3"></tct-skeleton>
    <tct-skeleton height="12" index="4"></tct-skeleton>
    <tct-skeleton width="80%" height="12" index="5"></tct-skeleton>
  </tct-vstack>
</tct-card>
