  <tct-skeleton width="56" height="56" radius="none"></tct-skeleton>
  <tct-skeleton width="56" height="56" radius="1"></tct-skeleton>
  <tct-skeleton width="56" height="56" radius="2"></tct-skeleton>
  <tct-skeleton width="56" height="56" radius="3"></tct-skeleton>
  <tct-skeleton width="56" height="56" radius="rounded"></tct-skeleton>
</div>
