<!-- title: Right-to-left; description: The track and the indicator sit on the inline start (the right), and arrow keys follow the list. -->
<div id="rtl-root" dir="rtl" lang="ar">
  <tct-outline active-id="rtl-b"></tct-outline>
  <script type="module">
    document.querySelector('#rtl-root tct-outline').items = [
      {id: 'rtl-a', label: 'مقدمة', level: 1},
      {id: 'rtl-b', label: 'التثبيت', level: 2},
      {id: 'rtl-c', label: 'الاستخدام', level: 2},
    ];
  </script>
</div>
