<!-- title: Columns; description: columns takes single, multi (as many as fit) or a number. -->
<div style="display: grid; gap: var(--spacing-6); max-inline-size: 44rem">
  <tct-metadata-list heading="Two columns" columns="2">
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
  <tct-metadata-list heading="Two columns, labels beside" columns="2" label-position="start">
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
  <tct-metadata-list heading="multi" columns="multi">
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
</div>
