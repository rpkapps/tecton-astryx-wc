<!-- title: Label position and width; description: label-position="top" stacks labels above values; label-width sets the label column. -->
<tct-vstack gap="6" max-width="28rem">
  <tct-metadata-list heading="Labels beside (default)" label-width="120">
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
  <tct-metadata-list heading="Labels on top" label-position="top">
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
</tct-vstack>
