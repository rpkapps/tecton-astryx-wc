<!-- title: Icons and rich values; description: An icon slot before the label; values are any content. -->
<div style="max-inline-size: 28rem">
  <tct-metadata-list heading="Record">
    <tct-metadata-list-item label="Owner">
      <tct-icon slot="icon" name="info"></tct-icon>
      Ada Lovelace
    </tct-metadata-list-item>
    <tct-metadata-list-item label="Website">
      <tct-icon slot="icon" name="info"></tct-icon>
      <a href="https://example.com">example.com</a>
    </tct-metadata-list-item>
    <tct-metadata-list-item label="Notes">A longer value wraps onto several lines instead of overflowing the list, however long it gets.</tct-metadata-list-item>
  </tct-metadata-list>
</div>
