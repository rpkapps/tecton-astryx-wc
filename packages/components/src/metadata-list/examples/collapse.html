<!-- title: Show more; description: max-num-of-items collapses a long list behind a Show more toggle; expanded starts it open. -->
<div style="display: grid; gap: var(--spacing-6); max-inline-size: 28rem">
  <tct-metadata-list heading="Collapsed" max-num-of-items="2">
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
  <tct-metadata-list heading="Starts expanded" max-num-of-items="2" expanded>
    <tct-metadata-list-item label="Quality">Good</tct-metadata-list-item>
    <tct-metadata-list-item label="Condition">Excellent</tct-metadata-list-item>
    <tct-metadata-list-item label="Status">Active</tct-metadata-list-item>
    <tct-metadata-list-item label="Depth">1,240 m</tct-metadata-list-item>
  </tct-metadata-list>
</div>
