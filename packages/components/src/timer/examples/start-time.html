<!-- title: Operation that started before mount; description: Pass the start as Unix milliseconds so the readout shows the whole wait. -->
<tct-hstack id="start-time-example" gap="2" v-align="center">
  <tct-text>Import running for</tct-text>
  <tct-timer type="body" color="primary" weight="semibold"></tct-timer>
</tct-hstack>
<script type="module">
  // The job began 47 seconds before this page rendered.
  document.getElementById('start-time-example').querySelector('tct-timer').startTime =
    Date.now() - 47_000;
</script>
