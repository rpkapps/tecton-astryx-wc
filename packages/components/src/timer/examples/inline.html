<!-- title: Inline in text; description: With type and color set to inherit the timer matches the surrounding text. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-3)">
  <tct-text>Processing for <tct-timer type="inherit" color="inherit"></tct-timer></tct-text>
  <tct-text type="large">Elapsed <tct-timer type="large" color="primary" format="clock"></tct-timer></tct-text>
</div>
