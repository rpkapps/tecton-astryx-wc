<!-- title: Attached and detached; description: attached sits directly under the control; detached adds a leading icon and a gap, for controls where the message would crowd the control. -->
<tct-vstack gap="6">
  <div>
    <tct-field-status variant="attached" type="error" message="Attached: text directly under the control."></tct-field-status>
  </div>
  <div>
    <tct-field-status variant="detached" type="error" message="Detached: icon and text with a gap above."></tct-field-status>
  </div>
</tct-vstack>
