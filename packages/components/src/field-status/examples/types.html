<!-- title: Types; description: error, warning, success and info messages are coloured text; the type is not the only carrier, so write what is wrong. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-2)">
  <tct-field-status type="error" message="Email must include an @."></tct-field-status>
  <tct-field-status type="warning" message="This name is already in use in another project."></tct-field-status>
  <tct-field-status type="success" message="Saved."></tct-field-status>
  <tct-field-status type="info" message="Changes apply after the next sync."></tct-field-status>
</div>
