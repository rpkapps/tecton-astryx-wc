<!-- title: Distribution; description: With a fixed height, v-align spreads the items along the column: between, around, evenly, or centered. -->
<tct-hstack id="distribution" wrap="wrap" gap="4">
  <tct-card variant="muted" padding="2" width="120" height="140"><tct-vstack v-align="between" height="100%"><span>between</span><span>b</span><span>c</span></tct-vstack></tct-card>
  <tct-card variant="muted" padding="2" width="120" height="140"><tct-vstack v-align="around" height="100%"><span>around</span><span>b</span><span>c</span></tct-vstack></tct-card>
  <tct-card variant="muted" padding="2" width="120" height="140"><tct-vstack v-align="evenly" height="100%"><span>evenly</span><span>b</span><span>c</span></tct-vstack></tct-card>
  <tct-card variant="muted" padding="2" width="120" height="140"><tct-vstack v-align="center" height="100%"><span>center</span><span>b</span><span>c</span></tct-vstack></tct-card>
</tct-hstack>
