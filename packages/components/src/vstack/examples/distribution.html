<!-- title: Distribution; description: With a fixed height, v-align spreads the items along the column: between, around, evenly, or centered. -->
<div id="distribution" style="display: flex; flex-wrap: wrap; gap: var(--spacing-4)">
  <tct-vstack v-align="between" height="140" padding="2" width="120" style="background: var(--color-background-muted)"><span>between</span><span>b</span><span>c</span></tct-vstack>
  <tct-vstack v-align="around" height="140" padding="2" width="120" style="background: var(--color-background-muted)"><span>around</span><span>b</span><span>c</span></tct-vstack>
  <tct-vstack v-align="evenly" height="140" padding="2" width="120" style="background: var(--color-background-muted)"><span>evenly</span><span>b</span><span>c</span></tct-vstack>
  <tct-vstack v-align="center" height="140" padding="2" width="120" style="background: var(--color-background-muted)"><span>center</span><span>b</span><span>c</span></tct-vstack>
</div>
