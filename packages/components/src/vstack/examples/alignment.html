<!-- title: Alignment; description: h-align aligns across the column (start, center, end, stretch); v-align distributes along it. alignment and justify are the aliases. -->
<div id="alignment" style="display: flex; flex-wrap: wrap; gap: var(--spacing-4)">
  <tct-vstack h-align="start" gap="1" padding="2" width="130" style="background: var(--color-background-muted)"><span>start</span><span>a</span></tct-vstack>
  <tct-vstack h-align="center" gap="1" padding="2" width="130" style="background: var(--color-background-muted)"><span>center</span><span>a</span></tct-vstack>
  <tct-vstack h-align="end" gap="1" padding="2" width="130" style="background: var(--color-background-muted)"><span>end</span><span>a</span></tct-vstack>
  <tct-vstack h-align="stretch" gap="1" padding="2" width="130" style="background: var(--color-background-muted)">
    <span style="background: var(--color-neutral)">stretch</span><span style="background: var(--color-neutral)">a</span>
  </tct-vstack>
</div>
