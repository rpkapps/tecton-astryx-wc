<!-- title: Alignment; description: h-align aligns across the column (start, center, end, stretch); v-align distributes along it. alignment and justify are the aliases. -->
<tct-hstack id="alignment" wrap="wrap" gap="4">
  <tct-card variant="muted" padding="2" width="130"><tct-vstack h-align="start" gap="1"><span>start</span><span>a</span></tct-vstack></tct-card>
  <tct-card variant="muted" padding="2" width="130"><tct-vstack h-align="center" gap="1"><span>center</span><span>a</span></tct-vstack></tct-card>
  <tct-card variant="muted" padding="2" width="130"><tct-vstack h-align="end" gap="1"><span>end</span><span>a</span></tct-vstack></tct-card>
  <tct-card variant="muted" padding="2" width="130">
    <tct-vstack h-align="stretch" gap="1"><tct-card padding="1">stretch</tct-card><tct-card padding="1">a</tct-card></tct-vstack>
  </tct-card>
</tct-hstack>
