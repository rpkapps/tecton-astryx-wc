<!-- title: Multiple rows; description: max-rows lets items wrap onto a bounded number of rows before the rest collapse into the indicator. -->
<tct-card padding="2" style="resize: horizontal; overflow: auto; inline-size: 18rem; min-inline-size: 8rem; max-inline-size: 100%">
  <tct-overflow-list show-count max-rows="2" gap="1">
    <tct-badge>Seismic</tct-badge>
    <tct-badge>Wells</tct-badge>
    <tct-badge>Faults</tct-badge>
    <tct-badge>Horizons</tct-badge>
    <tct-badge>Strata</tct-badge>
    <tct-badge>Logs</tct-badge>
    <tct-badge>Cores</tct-badge>
    <tct-badge>Pressure</tct-badge>
    <tct-badge>Volumes</tct-badge>
    <tct-badge>Surfaces</tct-badge>
  </tct-overflow-list>
</tct-card>
