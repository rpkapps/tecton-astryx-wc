<!-- title: Collapse from the start; description: collapse-from="start" hides the leading items and puts the indicator first. -->
<tct-card padding="2" style="resize: horizontal; overflow: auto; inline-size: 22rem; min-inline-size: 8rem; max-inline-size: 100%">
  <tct-overflow-list show-count collapse-from="start">
    <tct-badge>Seismic</tct-badge>
    <tct-badge>Wells</tct-badge>
    <tct-badge>Faults</tct-badge>
    <tct-badge>Horizons</tct-badge>
    <tct-badge>Strata</tct-badge>
    <tct-badge>Logs</tct-badge>
    <tct-badge>Cores</tct-badge>
    <tct-badge>Pressure</tct-badge>
  </tct-overflow-list>
</tct-card>
