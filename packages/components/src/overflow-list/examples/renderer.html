<!-- title: Custom indicator and change event; description: overflowRenderer returns the indicator (a template, a node or text); tct-overflow-change reports the collapsed items, for a menu the row already has. -->
<tct-vstack id="overflow-renderer-root" gap="2">
  <tct-card padding="2" style="resize: horizontal; overflow: auto; inline-size: 22rem; min-inline-size: 8rem; max-inline-size: 100%">
    <tct-overflow-list gap="1">
      <tct-badge>Seismic</tct-badge>
      <tct-badge>Wells</tct-badge>
      <tct-badge>Faults</tct-badge>
      <tct-badge>Horizons</tct-badge>
      <tct-badge>Strata</tct-badge>
      <tct-badge>Logs</tct-badge>
      <tct-badge>Cores</tct-badge>
      <tct-badge>Pressure</tct-badge>
    </tct-overflow-list>
  </tct-card>
  <output><tct-text type="inherit" color="secondary">Nothing is collapsed</tct-text></output>
  <script type="module">
    const root = document.getElementById('overflow-renderer-root');
    const list = root.querySelector('tct-overflow-list');
    const output = root.querySelector('output tct-text');
    list.overflowRenderer = (items) => {
      const more = document.createElement('button');
      more.type = 'button';
      more.textContent = `+${items.length} more`;
      more.setAttribute('aria-label', `${items.length} more items`);
      return more;
    };
    list.addEventListener('tct-overflow-change', (event) => {
      output.textContent = event.items.length
        ? 'Collapsed: ' + event.items.map((item) => item.element.textContent.trim()).join(', ')
        : 'Nothing is collapsed';
    });
  </script>
</tct-vstack>
