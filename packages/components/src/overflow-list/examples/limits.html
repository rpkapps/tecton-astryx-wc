<!-- title: Floor and cap; description: min-visible-items always shows that many; max-visible-items shows at most that many, even when everything fits. -->
<tct-vstack gap="4">
  <tct-card padding="2" style="resize: horizontal; overflow: auto; inline-size: 9rem; min-inline-size: 8rem; max-inline-size: 100%">
    <tct-overflow-list show-count min-visible-items="2">
      <tct-badge>Seismic</tct-badge>
      <tct-badge>Wells</tct-badge>
      <tct-badge>Faults</tct-badge>
      <tct-badge>Horizons</tct-badge>
      <tct-badge>Strata</tct-badge>
      <tct-badge>Logs</tct-badge>
      <tct-badge>Cores</tct-badge>
      <tct-badge>Pressure</tct-badge>
    </tct-overflow-list>
  </tct-card>
  <tct-card padding="2" style="resize: horizontal; overflow: auto; inline-size: 40rem; min-inline-size: 8rem; max-inline-size: 100%">
    <tct-overflow-list show-count max-visible-items="3">
      <tct-badge>Seismic</tct-badge>
      <tct-badge>Wells</tct-badge>
      <tct-badge>Faults</tct-badge>
      <tct-badge>Horizons</tct-badge>
      <tct-badge>Strata</tct-badge>
      <tct-badge>Logs</tct-badge>
      <tct-badge>Cores</tct-badge>
      <tct-badge>Pressure</tct-badge>
    </tct-overflow-list>
  </tct-card>
</tct-vstack>
