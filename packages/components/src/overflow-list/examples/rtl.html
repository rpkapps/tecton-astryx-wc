<!-- title: Right to left; description: The row and the indicator mirror: items start at the right and the indicator sits at the left end. -->
<div dir="rtl" style="resize: horizontal; overflow: auto; min-inline-size: 8rem; max-inline-size: 100%; padding: var(--spacing-2); border: var(--border-width) dashed var(--color-border); inline-size: 20rem">
  <tct-overflow-list show-count>
    <span style="display: inline-block; padding: var(--spacing-1) var(--spacing-3); border: var(--border-width) solid var(--color-border-emphasized); border-radius: var(--radius-full); color: var(--color-text-primary)">الزلزالية</span>
    <span style="display: inline-block; padding: var(--spacing-1) var(--spacing-3); border: var(--border-width) solid var(--color-border-emphasized); border-radius: var(--radius-full); color: var(--color-text-primary)">الآبار</span>
    <span style="display: inline-block; padding: var(--spacing-1) var(--spacing-3); border: var(--border-width) solid var(--color-border-emphasized); border-radius: var(--radius-full); color: var(--color-text-primary)">الصدوع</span>
    <span style="display: inline-block; padding: var(--spacing-1) var(--spacing-3); border: var(--border-width) solid var(--color-border-emphasized); border-radius: var(--radius-full); color: var(--color-text-primary)">الآفاق</span>
    <span style="display: inline-block; padding: var(--spacing-1) var(--spacing-3); border: var(--border-width) solid var(--color-border-emphasized); border-radius: var(--radius-full); color: var(--color-text-primary)">الطبقات</span>
    <span style="display: inline-block; padding: var(--spacing-1) var(--spacing-3); border: var(--border-width) solid var(--color-border-emphasized); border-radius: var(--radius-full); color: var(--color-text-primary)">السجلات</span>
  </tct-overflow-list>
</div>
