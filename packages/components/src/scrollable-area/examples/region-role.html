<!-- title: Region role and overscroll; description: viewport-role="region" makes the viewport a landmark, for a large scrollable part of a page. overscroll="contain" stops the page from scrolling when the region reaches its end. -->
<tct-card padding="0" width="320">
  <tct-scrollable-area label="Release notes" viewport-role="region" overscroll="contain" height="160" padding="3">
    <tct-vstack gap="2">
      <tct-text>Row 1</tct-text>
      <tct-text>Row 2</tct-text>
      <tct-text>Row 3</tct-text>
      <tct-text>Row 4</tct-text>
      <tct-text>Row 5</tct-text>
      <tct-text>Row 6</tct-text>
      <tct-text>Row 7</tct-text>
      <tct-text>Row 8</tct-text>
      <tct-text>Row 9</tct-text>
      <tct-text>Row 10</tct-text>
      <tct-text>Row 11</tct-text>
      <tct-text>Row 12</tct-text>
      <tct-text>Row 13</tct-text>
      <tct-text>Row 14</tct-text>
    </tct-vstack>
  </tct-scrollable-area>
</tct-card>
