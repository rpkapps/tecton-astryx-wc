<!-- title: Horizontal; description: axis="inline" scrolls along the inline axis. The axis is logical, so it follows the text direction and the writing mode. -->
<tct-card padding="0" width="320">
  <tct-scrollable-area label="Wide table" axis="inline" padding="3">
    <tct-card variant="muted" padding="3" style="inline-size: 720px"><tct-text>Content wider than the region.</tct-text></tct-card>
  </tct-scrollable-area>
</tct-card>
