<!-- title: Nothing to scroll; description: Content that fits does not scroll and the region is not a tab stop, so it adds nothing to the tab order. -->
<tct-card padding="0" width="320">
  <tct-scrollable-area label="Short list" height="160" padding="3">
    <tct-vstack gap="2">
      <tct-text>Row 1</tct-text>
      <tct-text>Row 2</tct-text>
    </tct-vstack>
  </tct-scrollable-area>
</tct-card>
