<!-- title: Keyboard ownership; description: With links or buttons inside, keyboard-owner="content-or-viewport" sends a forward Tab to the first one inside, and the viewport stays the stop for a reverse Tab and scrolls with the arrow keys. The default, viewport, is always the tab stop while the region scrolls. -->
<tct-card padding="0" width="320">
  <tct-scrollable-area label="Actions" keyboard-owner="content-or-viewport" height="140" padding="3">
    <tct-vstack gap="2">
      <tct-button label="First action"></tct-button>
      <tct-text>Row 1</tct-text>
      <tct-text>Row 2</tct-text>
      <tct-text>Row 3</tct-text>
      <tct-text>Row 4</tct-text>
      <tct-text>Row 5</tct-text>
      <tct-text>Row 6</tct-text>
      <tct-text>Row 7</tct-text>
      <tct-text>Row 8</tct-text>
      <tct-text>Row 9</tct-text>
      <tct-text>Row 10</tct-text>
    </tct-vstack>
  </tct-scrollable-area>
</tct-card>
