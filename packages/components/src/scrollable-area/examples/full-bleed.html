<!-- title: Full bleed; description: full-bleed lets the content run to the edges of an enclosing padded container: the region cancels that container padding. Here the card pads its content, and the scrolling region reaches its edges. -->
<tct-card padding="4" width="360">
  <tct-vstack gap="3">
    <tct-text type="medium-strong">Messages</tct-text>
    <tct-scrollable-area label="Messages" full-bleed height="140" padding="4">
    <tct-vstack gap="2">
      <tct-text>Row 1</tct-text>
      <tct-text>Row 2</tct-text>
      <tct-text>Row 3</tct-text>
      <tct-text>Row 4</tct-text>
      <tct-text>Row 5</tct-text>
      <tct-text>Row 6</tct-text>
      <tct-text>Row 7</tct-text>
      <tct-text>Row 8</tct-text>
      <tct-text>Row 9</tct-text>
      <tct-text>Row 10</tct-text>
      <tct-text>Row 11</tct-text>
      <tct-text>Row 12</tct-text>
      <tct-text>Row 13</tct-text>
      <tct-text>Row 14</tct-text>
    </tct-vstack>
    </tct-scrollable-area>
  </tct-vstack>
</tct-card>
