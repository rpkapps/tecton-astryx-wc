<!-- title: Status labels; description: Badges for states that need the reader's attention. -->

  <tct-badge variant="success">Active</tct-badge>
  <tct-badge variant="warning">Pending</tct-badge>

  <tct-badge variant="neutral">Draft</tct-badge>
</tct-hstack>
