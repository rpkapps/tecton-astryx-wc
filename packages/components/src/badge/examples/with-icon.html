<!-- title: With an icon; description: A leading icon in the icon slot always comes with a text label. -->
<div style="display: flex; gap: var(--spacing-2); align-items: center; flex-wrap: wrap">
  <tct-badge variant="success"><tct-icon slot="icon" name="check"></tct-icon>Verified</tct-badge>
  <tct-badge variant="warning"><tct-icon slot="icon" name="warning"></tct-icon>Needs review</tct-badge>
  <tct-badge variant="error"><tct-icon slot="icon" name="error"></tct-icon>Failed</tct-badge>
</div>
