<!-- title: Disabled; description: A disabled item cannot be toggled, leaves the tab order, and keeps its current state (an open item stays open). -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4); max-inline-size: 28rem">
  <tct-collapsible trigger="Disabled and collapsed" disabled>Hidden.</tct-collapsible>
  <tct-collapsible trigger="Disabled and open" disabled open>Still visible.</tct-collapsible>
</div>
