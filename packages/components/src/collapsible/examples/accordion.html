<!-- title: Accordion (single); description: A group with type="single" keeps one item open; has-dividers draws the FAQ row chrome for bare items. -->
<div style="max-inline-size: 32rem">
  <tct-collapsible-group has-dividers value="one">
    <tct-collapsible value="one" trigger="What is Tecton?">
      A design system, expressed here as framework independent Web Components.
    </tct-collapsible>
    <tct-collapsible value="two" trigger="How do I install it?">
      Import a family's define entry, or the autoloader, and load the token stylesheet once.
    </tct-collapsible>
    <tct-collapsible value="three" trigger="Does it support right-to-left?">
      Yes. Layout uses logical properties and arrows follow the visual direction.
    </tct-collapsible>
  </tct-collapsible-group>
</div>
