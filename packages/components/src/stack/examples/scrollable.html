<!-- title: Scrollable; description: scrollable turns on overflow: auto for a stack with a fixed height. Give the scrolling region a name and a tab stop when it has no focusable content. -->
<tct-stack id="scrollable-stack" scrollable height="140" width="260" gap="2" padding="2" tabindex="0" role="region" aria-label="Notifications" style="border: var(--border-width) solid var(--color-border)">
  <div>Notification 1</div>
  <div>Notification 2</div>
  <div>Notification 3</div>
  <div>Notification 4</div>
  <div>Notification 5</div>
  <div>Notification 6</div>
  <div>Notification 7</div>
  <div>Notification 8</div>
</tct-stack>
