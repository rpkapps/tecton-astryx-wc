<!-- title: Horizontal; description: direction="horizontal" flows the items in a row. tct-hstack and tct-vstack are the fixed-direction shorthands. -->
<tct-stack direction="horizontal" gap="2">
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Item 1</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Item 2</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Item 3</div>
</tct-stack>
