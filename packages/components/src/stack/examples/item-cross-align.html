<!-- title: Align one item; description: cross-align-self overrides the stack's cross-axis alignment for a single item. -->
<tct-stack direction="horizontal" gap="3" v-align="start" min-height="96" padding="2" style="background: var(--color-background-muted)">
  <tct-stack-item cross-align-self="start"><span>start</span></tct-stack-item>
  <tct-stack-item cross-align-self="center"><span>center</span></tct-stack-item>
  <tct-stack-item cross-align-self="end"><span>end</span></tct-stack-item>
  <tct-stack-item cross-align-self="stretch"><span style="background: var(--color-neutral); display: block; block-size: 100%">stretch</span></tct-stack-item>
</tct-stack>
