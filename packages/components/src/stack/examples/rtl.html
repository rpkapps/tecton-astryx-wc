<!-- title: Right-to-left; description: Start and end are logical: a horizontal stack flows from the right in RTL, and padding-inline-start pads the right edge. -->
<tct-vstack id="rtl" gap="4">
  <div dir="ltr">
    <tct-card variant="muted" padding="0"><tct-stack direction="horizontal" gap="2" padding-inline-start="6"><span>1</span><span>2</span><span>3</span></tct-stack></tct-card>
  </div>
  <div dir="rtl">
    <tct-card variant="muted" padding="0"><tct-stack direction="horizontal" gap="2" padding-inline-start="6"><span>1</span><span>2</span><span>3</span></tct-stack></tct-card>
  </div>
</tct-vstack>
