<!-- title: Wrapping; description: wrap="wrap" lets a horizontal stack flow onto the next line instead of overflowing. Try wrap before nesting stacks. -->
<tct-stack direction="horizontal" wrap="wrap" gap="2" max-width="360">
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Design</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Engineering</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Research</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Data science</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Operations</div>
  <div style="padding: var(--spacing-2) var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">Finance</div>
</tct-stack>
