<!-- title: Empty state; description: The empty-state slot shows while the list has no rows and goes away when the first message arrives. -->
<tct-vstack height="240" max-width="520">
  <tct-chat-message-list>
    <tct-empty-state slot="empty-state" heading="No messages yet" description="Ask a question to start the conversation."></tct-empty-state>
  </tct-chat-message-list>
</tct-vstack>
