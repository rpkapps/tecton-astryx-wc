<!-- title: Density and gap; description: density sets the row gap and the padding. gap overrides only the gap with a spacing step, for independent rows such as an event stream. -->
<tct-grid column-min-width="220" gap="4" max-width="640">
  <tct-chat-message-list density="compact" align="top">
    <tct-chat-message sender="assistant"><tct-chat-message-bubble>compact</tct-chat-message-bubble></tct-chat-message>
    <tct-chat-message sender="assistant"><tct-chat-message-bubble>compact</tct-chat-message-bubble></tct-chat-message>
  </tct-chat-message-list>
  <tct-chat-message-list gap="1" align="top">
    <tct-chat-message sender="assistant"><tct-chat-message-bubble>gap="1"</tct-chat-message-bubble></tct-chat-message>
    <tct-chat-message sender="assistant"><tct-chat-message-bubble>gap="1"</tct-chat-message-bubble></tct-chat-message>
  </tct-chat-message-list>
  <tct-chat-message-list density="spacious" align="top">
    <tct-chat-message sender="assistant"><tct-chat-message-bubble>spacious</tct-chat-message-bubble></tct-chat-message>
    <tct-chat-message sender="assistant"><tct-chat-message-bubble>spacious</tct-chat-message-bubble></tct-chat-message>
  </tct-chat-message-list>
</tct-grid>
