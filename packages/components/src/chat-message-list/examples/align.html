<!-- title: Alignment; description: align="bottom" rests a short conversation on the composer; align="top" starts at the top, for document-style or log-style lists. Once the messages fill the container both scroll the same way. -->
<tct-grid columns="2" gap="4" max-width="640">
  <tct-vstack height="220">
    <tct-chat-message-list align="bottom">
      <tct-chat-message sender="assistant"><tct-chat-message-bubble>align="bottom"</tct-chat-message-bubble></tct-chat-message>
    </tct-chat-message-list>
  </tct-vstack>
  <tct-vstack height="220">
    <tct-chat-message-list align="top">
      <tct-chat-message sender="assistant"><tct-chat-message-bubble>align="top"</tct-chat-message-bubble></tct-chat-message>
    </tct-chat-message-list>
  </tct-vstack>
</tct-grid>
