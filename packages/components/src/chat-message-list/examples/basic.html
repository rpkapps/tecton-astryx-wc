<!-- title: A message list; description: The list is a log of messages. In a container taller than its messages it rests them on the composer (align="bottom", the default). -->
<tct-vstack height="300" max-width="520">
  <tct-chat-message-list>
    <tct-chat-message sender="user">
      <tct-chat-message-bubble>Can you summarize this report?</tct-chat-message-bubble>
    </tct-chat-message>
    <tct-chat-message sender="assistant">
      <tct-avatar slot="avatar" name="Navi" size="sm"></tct-avatar>
      <tct-chat-message-bubble>Revenue is up 12% and churn is flat quarter over quarter.</tct-chat-message-bubble>
    </tct-chat-message>
  </tct-chat-message-list>
</tct-vstack>
