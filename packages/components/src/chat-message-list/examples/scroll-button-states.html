<!-- title: Scroll button states; description: An icon button while hidden content is above, and a pill with a label (typically "New messages") when something arrived below the fold. Hidden, it is not painted, not focusable and not in the accessibility tree. -->
<tct-vstack max-width="520" gap="2">
  <tct-chat-layout-scroll-button visible></tct-chat-layout-scroll-button>
  <tct-chat-layout-scroll-button visible label="New messages"></tct-chat-layout-scroll-button>
  <tct-chat-layout-scroll-button></tct-chat-layout-scroll-button>
</tct-vstack>
