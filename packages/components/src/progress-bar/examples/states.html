<!-- title: Disabled and hidden label; description: A disabled bar is grey for cancelled work. A hidden label stays available to assistive technology. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4); max-inline-size: 360px">
  <tct-progress-bar label="Cancelled upload" value="35" has-value-label disabled></tct-progress-bar>
  <tct-progress-bar label="Download progress" value="70" label-hidden></tct-progress-bar>
</div>
