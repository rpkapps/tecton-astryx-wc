<!-- title: Indeterminate; description: When the amount of work is unknown the fill slides and the semantics carry no value. Reduced motion slows the slide. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4); max-inline-size: 360px">
  <tct-progress-bar label="Searching" indeterminate></tct-progress-bar>
  <tct-progress-bar label="Syncing" indeterminate variant="neutral" label-hidden></tct-progress-bar>
</div>
