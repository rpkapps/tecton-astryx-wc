<!-- title: Target marks; description: Marks are fixed ticks on the track, in the same 0..max scale as the value. They take their colour from what they sit on and each label names the mark. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-6); max-inline-size: 360px">
  <tct-progress-bar id="below" label="Sales goal" value="40" has-value-label></tct-progress-bar>
  <tct-progress-bar id="past" label="Sales goal (reached)" value="85" has-value-label variant="success"></tct-progress-bar>
</div>
<script>
  document.getElementById('below').marks = [{value: 75, label: 'Goal: 75%'}];
  document.getElementById('past').marks = [
    {value: 50, label: 'Milestone: 50%'},
    {value: 75, label: 'Goal: 75%'},
  ];
</script>
