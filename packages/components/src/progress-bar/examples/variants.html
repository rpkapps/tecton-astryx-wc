<!-- title: Variants; description: Accent for general progress, success for completion, warning and error for alerts, neutral for background work. -->
<tct-vstack gap="3" max-width="360">
  <tct-progress-bar label="Accent" value="60" has-value-label variant="accent"></tct-progress-bar>
  <tct-progress-bar label="Success" value="100" has-value-label variant="success"></tct-progress-bar>
  <tct-progress-bar label="Warning" value="85" has-value-label variant="warning"></tct-progress-bar>
  <tct-progress-bar label="Error" value="95" has-value-label variant="error"></tct-progress-bar>
  <tct-progress-bar label="Neutral" value="30" has-value-label variant="neutral"></tct-progress-bar>
</tct-vstack>
