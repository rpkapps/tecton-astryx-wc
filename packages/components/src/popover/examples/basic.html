<!-- title: Basic; description: A trigger button in the default slot, the content in slot="content". The dialog needs a label. -->
<tct-popover label="Display settings">
  <button type="button">Settings</button>
  <tct-vstack slot="content" gap="2">
    <strong>Display</strong>
    <label>
      <tct-hstack gap="2" v-align="center"><input type="checkbox" checked /> Show grid</tct-hstack>
    </label>
    <label>
      <tct-hstack gap="2" v-align="center"><input type="checkbox" /> Snap to axes</tct-hstack>
    </label>
  </tct-vstack>
</tct-popover>
