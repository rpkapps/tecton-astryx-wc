<!-- title: Anchor to another element; description: When the trigger lives elsewhere, point `anchor` at its id (same tree) or set the anchorElement property. The element must be, or contain, a button. -->
<tct-hstack id="sibling-anchor-root" gap="3" v-align="center">
  <button id="sibling-anchor-button" type="button">External trigger</button>
  <tct-popover anchor="sibling-anchor-button" label="Actions" placement="below">
    <div slot="content">Attached to the button next to it, not wrapped by it.</div>
  </tct-popover>
</tct-hstack>
