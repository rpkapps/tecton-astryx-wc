<!-- title: Long content; description: Content taller than the available space scrolls inside the surface; content that fits never gets a scrollbar. -->
<tct-popover label="Long list" width="280">
  <button type="button">Long content</button>
  <tct-vstack slot="content" gap="2">
    <tct-text as="p" display="block">The surface is clamped to the viewport and scrolls inside when it must.</tct-text>
    <tct-card variant="muted" padding="3" style="block-size: 60vh">A tall region that forces the surface to scroll on short viewports.</tct-card>
    <button type="button">Last control</button>
  </tct-vstack>
</tct-popover>
