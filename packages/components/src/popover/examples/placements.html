<!-- title: Placement and alignment; description: The four placements with the three alignments. start and end are logical and mirror in RTL. -->
<tct-hstack wrap="wrap" gap="3" padding-block="10" padding-inline="8">
  <tct-popover label="Above" placement="above" alignment="center">
    <button type="button">Above</button>
    <div slot="content">Opens above the trigger, centred.</div>
  </tct-popover>
  <tct-popover label="Below" placement="below" alignment="start">
    <button type="button">Below</button>
    <div slot="content">Opens below, aligned to the start edge.</div>
  </tct-popover>
  <tct-popover label="Start" placement="start" alignment="center">
    <button type="button">Start</button>
    <div slot="content">Opens on the start side.</div>
  </tct-popover>
  <tct-popover label="End" placement="end" alignment="end">
    <button type="button">End</button>
    <div slot="content">Opens on the end side, aligned to the end edge.</div>
  </tct-popover>
</tct-hstack>
