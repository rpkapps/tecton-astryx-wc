<!-- title: Seconds and 24 hours; description: has-seconds adds seconds to the time part and the value; hour-format="24h" shows 14:30 instead of 2:30 PM. The value is the same either way. -->
<tct-vstack gap="4" max-width="520">
  <tct-date-time-input label="With seconds" has-seconds value="2026-03-21T14:30:15"></tct-date-time-input>
  <tct-date-time-input label="24-hour" hour-format="24h" value="2026-03-21T14:30"></tct-date-time-input>
</tct-vstack>
