<!-- title: Presentation; description: presentation chooses the surfaces. Popover and typed parts, a Date/Time tabbed bottom sheet, the browser's own inputs, or the adaptive forms that switch with the device. The deprecated native-picker maps to the same values. -->
<tct-vstack gap="4" max-width="520">
  <tct-date-time-input label="popover" presentation="popover" value="2026-03-21T14:30"></tct-date-time-input>
  <tct-date-time-input label="bottom-sheet" presentation="bottom-sheet" value="2026-03-21T14:30"></tct-date-time-input>
  <tct-date-time-input label="native" presentation="native" value="2026-03-21T14:30"></tct-date-time-input>
  <tct-date-time-input label="adaptive-bottom-sheet" presentation="adaptive-bottom-sheet" value="2026-03-21T14:30"></tct-date-time-input>
</tct-vstack>
