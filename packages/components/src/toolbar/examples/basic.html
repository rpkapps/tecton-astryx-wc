<!-- title: Basic; description: Secondary actions at the start, the primary action at the end. One Tab stop; arrows move between the controls. -->
<tct-toolbar label="Table actions" variant="section" dividers="bottom">
  <tct-button slot="start" variant="ghost" label="Back" icon="chevronLeft"></tct-button>
  <tct-button slot="start" variant="ghost" label="Filter" icon="funnel"></tct-button>
  <tct-button slot="end" variant="primary" label="New item"></tct-button>
</tct-toolbar>
