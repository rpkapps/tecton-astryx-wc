<!-- title: Sizes; description: Set size once on the toolbar; the buttons inside follow it. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-3)">
  <tct-toolbar label="Small" size="sm" dividers="top bottom">
    <tct-button slot="start" variant="ghost" label="Cut"></tct-button>
    <tct-button slot="start" variant="ghost" label="Copy"></tct-button>
    <tct-button slot="end" variant="primary" label="Save"></tct-button>
  </tct-toolbar>
  <tct-toolbar label="Medium" dividers="top bottom">
    <tct-button slot="start" variant="ghost" label="Cut"></tct-button>
    <tct-button slot="start" variant="ghost" label="Copy"></tct-button>
    <tct-button slot="end" variant="primary" label="Save"></tct-button>
  </tct-toolbar>
  <tct-toolbar label="Large" size="lg" dividers="top bottom">
    <tct-button slot="start" variant="ghost" label="Cut"></tct-button>
    <tct-button slot="start" variant="ghost" label="Copy"></tct-button>
    <tct-button slot="end" variant="primary" label="Save"></tct-button>
  </tct-toolbar>
</div>
