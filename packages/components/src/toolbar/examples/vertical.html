<!-- title: Vertical; description: orientation="vertical" stacks the areas; ArrowUp and ArrowDown move focus. -->
<div style="max-inline-size: 14rem">
  <tct-toolbar label="Tools" orientation="vertical" variant="section" dividers="start end">
    <tct-button slot="start" variant="ghost" label="Select" icon="check"></tct-button>
    <tct-button slot="start" variant="ghost" label="Search" icon="search"></tct-button>
    <tct-button slot="end" variant="ghost" label="Menu" icon="menu"></tct-button>
  </tct-toolbar>
</div>
