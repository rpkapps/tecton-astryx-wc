<!-- title: Three areas; description: Centre content is centred between the start and end areas regardless of their widths. -->
<tct-toolbar label="Editor" variant="muted">
  <tct-button slot="start" variant="ghost" label="Undo" icon="arrowLeft"></tct-button>
  <tct-segmented-control slot="center" label="View" value="edit">
    <tct-segmented-control-item value="edit" label="Edit"></tct-segmented-control-item>
    <tct-segmented-control-item value="preview" label="Preview"></tct-segmented-control-item>
  </tct-segmented-control>
  <tct-button slot="end" label="Share"></tct-button>
  <tct-button slot="end" variant="primary" label="Publish"></tct-button>
</tct-toolbar>
