<!-- title: Vertical; description: A vertical divider fills the height of its parent, here a row with a fixed height. -->
<tct-hstack id="vertical" gap="3" height="64">
  <tct-stack-item cross-align-self="center">Left</tct-stack-item>
  <tct-divider orientation="vertical"></tct-divider>
  <tct-stack-item cross-align-self="center">Middle</tct-stack-item>
  <tct-divider orientation="vertical" variant="strong" label="or"></tct-divider>
  <tct-stack-item cross-align-self="center">Right</tct-stack-item>
</tct-hstack>
