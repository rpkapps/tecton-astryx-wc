<!-- title: Vertical; description: A vertical divider fills the height of its parent, here a row with a fixed height. -->
<div id="vertical" style="display: flex; align-items: stretch; gap: var(--spacing-3); block-size: 64px">
  <span style="align-self: center">Left</span>
  <tct-divider orientation="vertical"></tct-divider>
  <span style="align-self: center">Middle</span>
  <tct-divider orientation="vertical" variant="strong" label="or"></tct-divider>
  <span style="align-self: center">Right</span>
</div>
