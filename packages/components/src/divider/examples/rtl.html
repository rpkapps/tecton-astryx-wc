<!-- title: Right-to-left; description: The rule and the label are symmetrical, so a divider looks the same in RTL. -->
<tct-vstack id="rtl" gap="4" max-width="360">
  <div dir="ltr"><tct-divider label="Section"></tct-divider></div>
  <div dir="rtl"><tct-divider label="Section"></tct-divider></div>
</tct-vstack>
