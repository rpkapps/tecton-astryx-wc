<!-- title: Dividers; description: dividers draws rules on the chosen sides: top, bottom, start, end. Start and end follow the direction. -->
<tct-vstack id="dividers" gap="3" max-width="360">
  <tct-section dividers="bottom">dividers="bottom"</tct-section>
  <tct-section dividers="top bottom">dividers="top bottom"</tct-section>
  <tct-section dividers="start end">dividers="start end"</tct-section>
</tct-vstack>
