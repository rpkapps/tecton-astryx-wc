<!-- title: Page layout; description: A page built from sections: a header region, a sidebar and a content region, separated by dividers. -->
<tct-card id="page-layout" padding="0" height="260">
  <tct-vstack height="100%">
    <tct-section dividers="bottom" padding-block="3"><tct-text type="medium-strong">Project settings</tct-text></tct-section>
    <tct-stack-item size="fill">
      <tct-hstack height="100%">
        <tct-section variant="muted" dividers="end" width="160" height="100%"><span>Sidebar</span></tct-section>
        <tct-stack-item size="fill"><tct-section variant="transparent" height="100%"><span>Content region</span></tct-section></tct-stack-item>
      </tct-hstack>
    </tct-stack-item>
  </tct-vstack>
</tct-card>
