<!-- title: Full bleed; description: A section nested in a padded container runs edge to edge across its inline padding, and across the block padding where it is the first or last child. -->
<tct-card width="320">
  <tct-section id="full-bleed" variant="muted" dividers="bottom" padding="3"><tct-text type="medium-strong">Header band</tct-text></tct-section>
  <p>Card content stays inside the padding.</p>
  <tct-section variant="muted" dividers="top" padding="3"><span>Footer band</span></tct-section>
</tct-card>
