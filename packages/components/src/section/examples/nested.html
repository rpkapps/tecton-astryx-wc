<!-- title: Nested padding; description: An explicit padding step is passed on to nested sections that set none; a nested section with its own padding keeps it. -->
<tct-section id="nested" variant="muted" padding="6" width="360">
  <tct-section variant="section">inherits padding 6 from its parent</tct-section>
  <tct-section variant="section" padding="1">sets padding 1 itself</tct-section>
</tct-section>
