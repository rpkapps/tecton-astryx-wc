<!-- title: Variants; description: section (default, the surface colour), transparent and muted. -->
<div id="variants" style="display: grid; gap: var(--spacing-3); background: var(--color-background-body); padding: var(--spacing-3); max-inline-size: 360px">
  <tct-section variant="section">variant="section"</tct-section>
  <tct-section variant="transparent">variant="transparent"</tct-section>
  <tct-section variant="muted">variant="muted"</tct-section>
</div>
