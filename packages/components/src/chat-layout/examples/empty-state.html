<!-- title: Empty conversation; description: The empty-state slot is centred in the message area while the default slot has no content, and goes away when the first message arrives. -->
<tct-vstack height="380" max-width="560">
  <tct-chat-layout>
    <tct-empty-state slot="empty-state" heading="Start a conversation" description="Ask about a well, a forecast or a work order."></tct-empty-state>
    <tct-chat-composer slot="composer"></tct-chat-composer>
  </tct-chat-layout>
</tct-vstack>
