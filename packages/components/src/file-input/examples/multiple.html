<!-- title: Multiple files; description: multiple lets several files be chosen; every file submits as its own entry under the name. max-files leaves out the rest with an error. -->
<tct-vstack gap="4">
  <tct-file-input label="Attachments" multiple max-files="3" description="Up to 3 files." name="attachments"></tct-file-input>
  <tct-file-input label="Attachments (dropzone)" mode="dropzone" multiple max-files="3" name="attachments-drop"></tct-file-input>
</tct-vstack>
