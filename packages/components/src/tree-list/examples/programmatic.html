<!-- title: Programmatic control and rich header; description: expand(), collapse(), toggle(), isExpanded() and focusItem() drive the tree without firing tct-tree-toggle; the header slot takes rich content. -->
<tct-vstack id="programmatic-root" gap="3" max-width="26rem">
  <tct-hstack wrap="wrap" gap="2">
    <tct-button data-action="expand" label="Expand all"></tct-button>
    <tct-button data-action="collapse" label="Collapse all"></tct-button>
    <tct-button data-action="focus" label="Focus Logs"></tct-button>
  </tct-hstack>
  <tct-tree-list>
    <strong slot="header">Build artefacts</strong>
  </tct-tree-list>
  <script type="module">
    const root = document.getElementById('programmatic-root');
    const tree = root.querySelector('tct-tree-list');
    const branches = ['dist', 'maps', 'reports'];
    tree.items = [
      {id: 'dist', label: 'dist', children: [{id: 'bundle', label: 'bundle.js'}, {id: 'maps', label: 'maps', children: [{id: 'bundle-map', label: 'bundle.js.map'}]}]},
      {id: 'reports', label: 'reports', children: [{id: 'logs', label: 'Logs'}, {id: 'coverage', label: 'Coverage'}]},
    ];
    root.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'expand') for (const id of branches) tree.expand(id);
      if (action === 'collapse') for (const id of branches) tree.collapse(id);
      if (action === 'focus') {
        tree.expand('reports');
        tree.updateComplete.then(() => tree.focusItem('logs'));
      }
    });
  </script>
</tct-vstack>
