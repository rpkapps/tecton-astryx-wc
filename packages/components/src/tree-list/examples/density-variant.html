<!-- title: Density and guide lines; description: Row spacing (compact, balanced, spacious) is independent of the guide variant (lineGuides, noGuides); the indent and row gap are themeable levers. -->
<tct-grid id="density-variant-root" column-min-width="224" column-repeat="fit" gap="6">
  <tct-tree-list header="Compact, line guides" density="compact"></tct-tree-list>
  <tct-tree-list header="Balanced, no guides" variant="noGuides"></tct-tree-list>
  <tct-tree-list header="Spacious, wide indent" density="spacious" style="--tree-list-indent: var(--spacing-6)"></tct-tree-list>
  <script type="module">
    const items = () => [
      {
        id: 'src',
        label: 'src',
        isExpanded: true,
        children: [
          {id: 'components', label: 'components', isExpanded: true, children: [{id: 'button', label: 'button.ts'}, {id: 'tree', label: 'tree.ts'}]},
          {id: 'index', label: 'index.ts'},
        ],
      },
      {id: 'package', label: 'package.json'},
    ];
    for (const tree of document.querySelectorAll('#density-variant-root tct-tree-list')) tree.items = items();
  </script>
</tct-grid>
