<!-- title: Colours and alignment; description: Colour roles and logical alignment for headings.; a11y-exempt: color-contrast | The disabled role is shown as a colour swatch outside an inactive control; WCAG 1.4.3 exempts text of inactive user interface components, and this role is only meant for that use. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-2)">
  <tct-heading level="3" color="primary">Primary (default)</tct-heading>
  <tct-heading level="3" color="secondary">Secondary</tct-heading>
  <tct-heading level="3" color="accent">Accent</tct-heading>
  <tct-heading level="3" color="disabled">Disabled</tct-heading>
  <tct-heading level="3" justify="center">Centred</tct-heading>
  <tct-heading level="3" has-strikethrough>Strikethrough</tct-heading>
</div>
