<!-- title: Truncation; description: max-lines truncates a long title; hover the cut-off heading to see the full text in a tooltip. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4); inline-size: 260px; padding-block-start: var(--spacing-8)">
  <tct-heading level="3" max-lines="1">A very long section title that cannot fit into this column</tct-heading>
  <tct-heading level="3" max-lines="2">Two lines of this long section title are shown, then the rest is clamped away with an ellipsis</tct-heading>
  <tct-heading level="3" max-lines="1" no-truncate-tooltip>The same title without a tooltip, cut off with an ellipsis</tct-heading>
</div>
