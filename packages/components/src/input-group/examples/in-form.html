<!-- title: In a form; description: The controls inside the group are the form participants: they submit with their own names, and a required control blocks the submit and shows its error on the group. -->
<!-- layout: pending tct-stack -->
<form id="in-form-input-group">
  <tct-input-group label="Price">
    <tct-input-group-text>$</tct-input-group-text>
    <tct-text-input label="Amount" label-hidden name="amount" required></tct-text-input>
    <tct-input-group-text>USD</tct-input-group-text>
  </tct-input-group>
  <tct-button type="submit" variant="primary">Save</tct-button>
  <output></output>
</form>
<script type="module">
  const form = document.getElementById('in-form-input-group');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    form.querySelector('output').textContent = JSON.stringify(Object.fromEntries(new FormData(form)));
  });
</script>
