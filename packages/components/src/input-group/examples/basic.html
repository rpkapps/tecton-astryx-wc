<!-- title: Basic; description: A currency field. The addons share the input's border, the label is shown once for the group, and one focus ring surrounds everything. -->
<!-- layout: pending tct-stack -->
<tct-input-group label="Price" description="In US dollars.">
  <tct-input-group-text>$</tct-input-group-text>
  <tct-number-input label="Amount" label-hidden name="amount" placeholder="0.00"></tct-number-input>
  <tct-input-group-text>USD</tct-input-group-text>
</tct-input-group>
