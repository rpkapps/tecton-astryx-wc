<!-- title: Colours; description: primary (default) and secondary use the text roles; inherit follows the surrounding text, for code inside a coloured line. -->
<tct-vstack id="colors" gap="2">
  <span><tct-code color="primary">primary</tct-code></span>
  <span><tct-code color="secondary">secondary</tct-code></span>
  <tct-text color="accent"><tct-code color="inherit">inherit (accent line)</tct-code></tct-text>
</tct-vstack>
