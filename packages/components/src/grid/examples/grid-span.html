<!-- title: Grid span; description: Wrap an item in tct-grid-span to span several columns (a number, or full) or rows. -->
<tct-grid columns="4" row-height="56" gap="2">
  <tct-grid-span columns="full"><div style="background: var(--color-neutral); padding: var(--spacing-2)">columns="full"</div></tct-grid-span>
  <tct-grid-span columns="2" rows="2"><div style="background: var(--color-neutral); padding: var(--spacing-2)">columns 2, rows 2</div></tct-grid-span>
  <div style="background: var(--color-background-muted); padding: var(--spacing-2)">a</div>
  <div style="background: var(--color-background-muted); padding: var(--spacing-2)">b</div>
  <div style="background: var(--color-background-muted); padding: var(--spacing-2)">c</div>
  <div style="background: var(--color-background-muted); padding: var(--spacing-2)">d</div>
  <tct-grid-span columns="3"><div style="background: var(--color-neutral); padding: var(--spacing-2)">columns="3"</div></tct-grid-span>
  <div style="background: var(--color-background-muted); padding: var(--spacing-2)">e</div>
</tct-grid>
