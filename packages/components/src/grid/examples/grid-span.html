<!-- title: Grid span; description: Wrap an item in tct-grid-span to span several columns (a number, or full) or rows. -->
<tct-grid columns="4" row-height="56" gap="2">
  <tct-grid-span columns="full"><tct-card padding="2">columns="full"</tct-card></tct-grid-span>
  <tct-grid-span columns="2" rows="2"><tct-card padding="2">columns 2, rows 2</tct-card></tct-grid-span>
  <tct-card variant="muted" padding="2">a</tct-card>
  <tct-card variant="muted" padding="2">b</tct-card>
  <tct-card variant="muted" padding="2">c</tct-card>
  <tct-card variant="muted" padding="2">d</tct-card>
  <tct-grid-span columns="3"><tct-card padding="2">columns="3"</tct-card></tct-grid-span>
  <tct-card variant="muted" padding="2">e</tct-card>
</tct-grid>
