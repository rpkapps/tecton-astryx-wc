<!-- title: Capped column count; description: column-max limits the number of columns on wide screens while the columns still fill the row; a lone column stretches to the full width. -->
<tct-grid column-min-width="120" column-max="3" gap="3">
  <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">1</div>
  <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">2</div>
  <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">3</div>
  <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">4</div>
  <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">5</div>
</tct-grid>
