<!-- title: Dashboard; description: A dashboard of tiles: a full-width banner, a wide chart, a tall list and small metrics, placed with tct-grid-span. -->
<tct-grid columns="4" row-height="72" gap="3">
  <tct-grid-span columns="full"><tct-card variant="muted" padding="3">Field overview</tct-card></tct-grid-span>
  <tct-grid-span columns="3" rows="3"><tct-card variant="muted" padding="3">Production chart</tct-card></tct-grid-span>
  <tct-grid-span rows="2"><tct-card variant="muted" padding="3">Wells</tct-card></tct-grid-span>
  <tct-card variant="muted" padding="3">Uptime</tct-card>
</tct-grid>
