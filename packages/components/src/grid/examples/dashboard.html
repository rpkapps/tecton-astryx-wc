<!-- title: Dashboard; description: A dashboard of tiles: a full-width banner, a wide chart, a tall list and small metrics, placed with tct-grid-span. -->
<tct-grid columns="4" row-height="72" gap="3">
  <tct-grid-span columns="full"><div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-container)">Field overview</div></tct-grid-span>
  <tct-grid-span columns="3" rows="3"><div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-container)">Production chart</div></tct-grid-span>
  <tct-grid-span rows="2"><div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-container)">Wells</div></tct-grid-span>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-container)">Uptime</div>
</tct-grid>
