<!-- title: Responsive columns; description: column-min-width makes as many columns as fit, each at least that wide. Resize the container to see it reflow. -->
<div id="responsive" style="resize: horizontal; overflow: auto; inline-size: 100%; max-inline-size: 100%">
  <tct-grid column-min-width="140" gap="3">
    <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">Card 1</div>
    <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">Card 2</div>
    <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">Card 3</div>
    <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">Card 4</div>
    <div style="padding: var(--spacing-4); background: var(--color-background-muted); border-radius: var(--radius-element)">Card 5</div>
  </tct-grid>
</div>
