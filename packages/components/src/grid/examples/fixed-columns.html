<!-- title: Fixed columns; description: columns="3" gives three equal columns that always keep the count. -->
<tct-grid columns="3" gap="2">
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">1</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">2</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">3</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">4</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">5</div>
  <div style="padding: var(--spacing-3); background: var(--color-background-muted); border-radius: var(--radius-element)">6</div>
</tct-grid>
