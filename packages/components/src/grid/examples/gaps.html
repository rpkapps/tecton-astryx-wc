<!-- title: Gaps; description: gap sets both axes; row-gap and column-gap override it per axis. -->
<tct-vstack id="gaps" gap="6">
  <tct-grid columns="3" gap="1">
    <tct-card variant="muted" padding="2">gap="1"</tct-card>
    <tct-card variant="muted" padding="2">b</tct-card>
    <tct-card variant="muted" padding="2">c</tct-card>
    <tct-card variant="muted" padding="2">d</tct-card>
  </tct-grid>
  <tct-grid columns="3" gap="1" row-gap="6" column-gap="3">
    <tct-card variant="muted" padding="2">row 6, column 3</tct-card>
    <tct-card variant="muted" padding="2">b</tct-card>
    <tct-card variant="muted" padding="2">c</tct-card>
    <tct-card variant="muted" padding="2">d</tct-card>
  </tct-grid>
</tct-vstack>
