<!-- title: Right-to-left; description: The first column is at the inline start, so a grid mirrors under dir="rtl". -->
<tct-vstack id="rtl" gap="4">
  <div dir="ltr">
    <tct-grid columns="3" gap="2"><tct-card variant="muted" padding="2">1</tct-card><tct-card variant="muted" padding="2">2</tct-card><tct-card variant="muted" padding="2">3</tct-card></tct-grid>
  </div>
  <div dir="rtl">
    <tct-grid columns="3" gap="2"><tct-card variant="muted" padding="2">1</tct-card><tct-card variant="muted" padding="2">2</tct-card><tct-card variant="muted" padding="2">3</tct-card></tct-grid>
  </div>
</tct-vstack>
