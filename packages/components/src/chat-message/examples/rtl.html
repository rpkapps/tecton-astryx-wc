<!-- title: Right-to-left; description: Alignment, avatars, corners and the metadata row all follow the reading direction: the user's messages are at the left edge in an RTL page. -->
<tct-vstack dir="rtl" lang="ar" max-width="520" gap="4">
  <tct-chat-message sender="assistant" name="نافي">
    <tct-avatar slot="avatar" name="نافي" size="sm"></tct-avatar>
    <tct-chat-message-bubble group="first">مرحبا، كيف يمكنني المساعدة؟</tct-chat-message-bubble>
    <tct-chat-message-bubble group="last">يمكنني تلخيص التقرير.</tct-chat-message-bubble>
  </tct-chat-message>
  <tct-chat-message sender="user">
    <tct-chat-message-bubble>لخّص التقرير من فضلك.
      <tct-chat-message-metadata slot="metadata" timestamp="٢:٣٠ م" status="sent"></tct-chat-message-metadata>
    </tct-chat-message-bubble>
  </tct-chat-message>
</tct-vstack>
