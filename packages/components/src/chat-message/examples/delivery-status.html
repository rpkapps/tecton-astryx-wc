<!-- title: Delivery status; description: sending, sent, delivered, read and error. Each has an icon and a word, and is named "Message {status}" for assistive technology. Sending pulses unless motion is reduced. -->
<tct-vstack max-width="520" gap="2">
  <tct-chat-message-metadata timestamp="2:30 PM" status="sending"></tct-chat-message-metadata>
  <tct-chat-message-metadata timestamp="2:30 PM" status="sent"></tct-chat-message-metadata>
  <tct-chat-message-metadata timestamp="2:30 PM" status="delivered"></tct-chat-message-metadata>
  <tct-chat-message-metadata timestamp="2:30 PM" status="read"></tct-chat-message-metadata>
  <tct-chat-message-metadata timestamp="2:30 PM" status="error"></tct-chat-message-metadata>
</tct-vstack>
