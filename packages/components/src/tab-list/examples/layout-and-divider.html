<!-- title: Layout and divider; description: layout="fill" stretches the tabs equally across the strip; has-divider draws a rule under the strip and the selected indicator sits on it. -->
<tct-vstack gap="5">
  <tct-tab-list value="one" layout="fill" label="Filled tabs">
    <tct-tab value="one" label="Overview"></tct-tab>
    <tct-tab value="two" label="Activity"></tct-tab>
    <tct-tab value="three" label="Settings"></tct-tab>
  </tct-tab-list>
  <tct-tab-list value="two" has-divider label="Divided tabs">
    <tct-tab value="one" label="Overview"></tct-tab>
    <tct-tab value="two" label="Activity"></tct-tab>
    <tct-tab value="three" label="Settings"></tct-tab>
  </tct-tab-list>
</tct-vstack>
