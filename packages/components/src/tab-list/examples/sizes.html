<!-- title: Sizes; description: The tab height follows the element-size scale (sm, md, lg), like Button and TextInput. Unset, the size follows an enclosing size provider or toolbar. -->
<tct-vstack gap="4">
  <tct-tab-list value="one" size="sm" label="Small tabs">
    <tct-tab value="one" label="Small"></tct-tab>
    <tct-tab value="two" label="Tabs"></tct-tab>
    <tct-tab value="three" label="Here"></tct-tab>
  </tct-tab-list>
  <tct-tab-list value="one" size="md" label="Medium tabs">
    <tct-tab value="one" label="Medium"></tct-tab>
    <tct-tab value="two" label="Tabs"></tct-tab>
    <tct-tab value="three" label="Here"></tct-tab>
  </tct-tab-list>
  <tct-tab-list value="one" size="lg" label="Large tabs">
    <tct-tab value="one" label="Large"></tct-tab>
    <tct-tab value="two" label="Tabs"></tct-tab>
    <tct-tab value="three" label="Here"></tct-tab>
  </tct-tab-list>
</tct-vstack>
