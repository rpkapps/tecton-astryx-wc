<!-- title: Actions and dismiss; description: Actions go in the end slot. dismissable adds a dismiss button; the banner hides itself, fires a cancelable tct-dismiss first, and returns focus to where it came from. -->
<div id="actions-and-dismiss" style="display: flex; flex-direction: column; gap: var(--spacing-3)">
  <tct-banner status="warning" heading="Two-factor authentication is off" dismissable>
    <tct-button slot="end" variant="ghost" size="sm" label="Turn on"></tct-button>
  </tct-banner>
  <tct-banner status="info" heading="Import finished" description="128 rows were added." dismissable dismiss-label="Dismiss import notice"></tct-banner>
  <p data-output style="color: var(--color-text-secondary)">Nothing dismissed yet.</p>
</div>
<script type="module">
  const root = document.getElementById('actions-and-dismiss');
  root.addEventListener('tct-dismiss', (event) => {
    root.querySelector('[data-output]').textContent = `Dismissed: ${event.target.heading}`;
  });
</script>
