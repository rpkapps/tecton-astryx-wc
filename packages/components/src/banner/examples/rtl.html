<!-- title: Right-to-left; description: The icon leads at the inline start, the actions sit at the inline end, and a dismiss returns focus. -->
<div dir="rtl" lang="ar" style="display: flex; flex-direction: column; gap: var(--spacing-3)">
  <tct-banner status="success" heading="تم الحفظ" description="تم تحديث إعداداتك." dismissable>
    <tct-button slot="end" variant="ghost" size="sm" label="تراجع"></tct-button>
  </tct-banner>
</div>
