<!-- title: Right to left; description: An RTL locale together with dir="rtl": the subtree mirrors, directional icons flip, and components read the direction. -->
<tct-internationalization-provider locale="ar-SA" dir="rtl">
  <tct-hstack gap="3" v-align="center">
    <tct-button variant="primary">التالي<tct-icon slot="end" name="chevronRight"></tct-icon></tct-button>
    <tct-button>إلغاء</tct-button>
    <tct-spinner label="جار التحميل"></tct-spinner>
  </tct-hstack>
</tct-internationalization-provider>
