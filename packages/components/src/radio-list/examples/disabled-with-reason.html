<!-- title: Disabled with a reason; description: disabled-message keeps the options focusable and explains why the group is disabled in a tooltip on hover and keyboard focus; choosing stays blocked. -->
<tct-vstack gap="4">
  <tct-radio-list label="Billing cycle" disabled disabled-message="Billing is managed by your administrator." value="monthly">
    <tct-radio-list-item label="Monthly" value="monthly"></tct-radio-list-item>
    <tct-radio-list-item label="Yearly" value="yearly"></tct-radio-list-item>
  </tct-radio-list>
</tct-vstack>
