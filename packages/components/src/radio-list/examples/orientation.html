<!-- title: Orientation and size; description: orientation="horizontal" puts the options in a wrapping row; size sm draws 20px radios. -->
<tct-vstack gap="4">
  <tct-radio-list label="Alignment" orientation="horizontal" value="start" name="alignment">
    <tct-radio-list-item label="Start" value="start"></tct-radio-list-item>
    <tct-radio-list-item label="Centre" value="center"></tct-radio-list-item>
    <tct-radio-list-item label="End" value="end"></tct-radio-list-item>
  </tct-radio-list>
  <tct-radio-list label="Compact" size="sm" orientation="horizontal" value="a">
    <tct-radio-list-item label="A" value="a"></tct-radio-list-item>
    <tct-radio-list-item label="B" value="b"></tct-radio-list-item>
  </tct-radio-list>
</tct-vstack>
