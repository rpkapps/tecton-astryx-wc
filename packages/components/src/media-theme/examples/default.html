<!-- title: Default; description: On a dark surface, mode="auto" measures what was painted and gives the content the dark side: light text and inks. -->
<div id="default" style="max-inline-size: 360px; padding: var(--spacing-4); border-radius: var(--radius-container); background-color: var(--color-background-inverted)">
  <tct-media-theme mode="auto">
    <tct-vstack gap="2">
      <tct-text type="body" weight="bold" display="block">Media overlay</tct-text>
      <tct-text type="supporting" display="block">Text and actions adapt to the surface they sit on.</tct-text>
      <tct-button label="Watch now" variant="secondary" size="sm"></tct-button>
    </tct-vstack>
  </tct-media-theme>
</div>
