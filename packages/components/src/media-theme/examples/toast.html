<!-- title: Inverted notice; description: A notice on the inverted surface: the provider makes its text and action readable on it, as a toast or tooltip needs. -->
<div id="toast" style="display: inline-flex; align-items: center; gap: var(--spacing-3); padding: var(--spacing-3) var(--spacing-4); border-radius: var(--radius-container); background-color: var(--color-background-inverted)">
  <tct-media-theme mode="auto">
    <tct-text>Well A-12 archived.</tct-text>
    <tct-button label="Undo" variant="ghost" size="sm"></tct-button>
  </tct-media-theme>
</div>
