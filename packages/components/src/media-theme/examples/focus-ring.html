<!-- title: Focus ring on an inverted surface; description: The focus ring follows the surface side. Tab to a button: the ring is the side's ring, not the page's. -->
<tct-vstack id="focus-ring" gap="4" max-width="360">
  <tct-stack padding="4" style="background-color: rgb(20, 16, 26); border-radius: var(--radius-container)">
    <tct-media-theme mode="dark"><tct-button label="On a dark surface" variant="secondary"></tct-button></tct-media-theme>
  </tct-stack>
  <tct-stack padding="4" style="background-color: rgb(246, 245, 248); border-radius: var(--radius-container)">
    <tct-media-theme mode="light"><tct-button label="On a light surface" variant="secondary"></tct-button></tct-media-theme>
  </tct-stack>
</tct-vstack>
