<!-- title: States; description: Optional, disabled with a reason that keeps the field focusable, read-only (tokens without remove buttons), and loading; a11y-exempt: color-contrast | The disabled tokenizer is an inactive component, which WCAG 1.4.3 exempts from the contrast requirement. -->
<tct-vstack id="states-root" max-width="420" gap="4">
  <tct-tokenizer label="Optional" optional has-clear></tct-tokenizer>
  <tct-tokenizer label="Disabled with a reason" disabled disabled-message="Teams are set by your admin."></tct-tokenizer>
  <tct-tokenizer label="Read-only" readonly></tct-tokenizer>
  <tct-tokenizer label="Loading" loading></tct-tokenizer>
</tct-vstack>
<script type="module">
  import {createStaticSource} from '@tecton-wc/components/typeahead/utils.js';

  const teams = [
    {id: 'design', label: 'Design'},
    {id: 'engineering', label: 'Engineering'},
    {id: 'marketing', label: 'Marketing'},
    {id: 'sales', label: 'Sales'},
    {id: 'support', label: 'Support'},
    {id: 'legal', label: 'Legal'},
    {id: 'finance', label: 'Finance'},
    {id: 'people', label: 'People'},
  ];
  for (const field of document.querySelectorAll('#states-root tct-tokenizer')) {
    field.searchSource = createStaticSource(teams);
    field.items = [teams[0], teams[2]];
  }
</script>
