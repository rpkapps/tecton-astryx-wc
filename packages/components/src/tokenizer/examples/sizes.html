<!-- title: Sizes; description: size is sm, md or lg. The field, the tokens and the result rows follow it; unset, the field takes the nearest size provider. -->
<tct-vstack id="sizes-root" max-width="420" gap="4">
  <tct-tokenizer label="Small" size="sm"></tct-tokenizer>
  <tct-tokenizer label="Medium" size="md"></tct-tokenizer>
  <tct-tokenizer label="Large" size="lg"></tct-tokenizer>
</tct-vstack>
<script type="module">
  import {createStaticSource} from '@tecton-wc/components/typeahead/utils.js';

  const teams = [
    {id: 'design', label: 'Design'},
    {id: 'engineering', label: 'Engineering'},
    {id: 'marketing', label: 'Marketing'},
    {id: 'sales', label: 'Sales'},
    {id: 'support', label: 'Support'},
    {id: 'legal', label: 'Legal'},
    {id: 'finance', label: 'Finance'},
    {id: 'people', label: 'People'},
  ];
  for (const field of document.querySelectorAll('#sizes-root tct-tokenizer')) {
    field.searchSource = createStaticSource(teams);
    field.items = [teams[0], teams[1]];
  }
</script>
