<!-- title: Right-to-left; description: The badges flow with the direction of the page: the first key is at the inline start. -->
<tct-vstack id="rtl" gap="3">
  <div dir="ltr"><tct-kbd keys="ctrl+shift+k"></tct-kbd></div>
  <div dir="rtl"><tct-kbd keys="ctrl+shift+k"></tct-kbd></div>
</tct-vstack>
