<!-- title: Modifier combinations; description: Modifier keys show glyphs: ctrl, alt and shift, alone and combined with mod. -->
<div id="modifiers" style="display: flex; flex-wrap: wrap; gap: var(--spacing-4)">
  <tct-kbd keys="mod+c"></tct-kbd>
  <tct-kbd keys="ctrl+c"></tct-kbd>
  <tct-kbd keys="alt+tab"></tct-kbd>
  <tct-kbd keys="shift+enter"></tct-kbd>
  <tct-kbd keys="mod+shift+p"></tct-kbd>
  <tct-kbd keys="ctrl+alt+shift+k"></tct-kbd>
</div>
