<!-- title: Menu shortcuts; description: A shortcut at the end of each row of a menu-like list, aligned to the inline end. -->
<tct-card id="menu-shortcuts" width="260" padding="1">
  <tct-vstack>
    <tct-hstack v-align="center" padding="2"><tct-stack-item size="fill">Open</tct-stack-item><tct-kbd keys="mod+o"></tct-kbd></tct-hstack>
    <tct-hstack v-align="center" padding="2"><tct-stack-item size="fill">Rename</tct-stack-item><tct-kbd keys="f2"></tct-kbd></tct-hstack>
    <tct-hstack v-align="center" padding="2"><tct-stack-item size="fill">Delete</tct-stack-item><tct-kbd keys="mod+backspace"></tct-kbd></tct-hstack>
  </tct-vstack>
</tct-card>
