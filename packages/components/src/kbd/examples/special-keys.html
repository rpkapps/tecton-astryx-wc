<!-- title: Special keys; description: Named keys and their aliases. Write plus for a literal + key. -->
<div id="special-keys" style="display: flex; flex-wrap: wrap; gap: var(--spacing-4)">
  <tct-kbd keys="enter"></tct-kbd>
  <tct-kbd keys="return"></tct-kbd>
  <tct-kbd keys="escape"></tct-kbd>
  <tct-kbd keys="esc"></tct-kbd>
  <tct-kbd keys="tab"></tct-kbd>
  <tct-kbd keys="backspace"></tct-kbd>
  <tct-kbd keys="up"></tct-kbd>
  <tct-kbd keys="down"></tct-kbd>
  <tct-kbd keys="left"></tct-kbd>
  <tct-kbd keys="right"></tct-kbd>
  <tct-kbd keys="shift+plus"></tct-kbd>
  <tct-kbd keys="f1"></tct-kbd>
</div>
