<!-- title: Inline preview; description: inline renders the content in the page without the modal behaviour, for documentation and showcases. It is a named group, not an alertdialog, and it does not trap focus or answer Escape. -->
<tct-alert-dialog
  inline
  open
  heading="Delete item?"
  description="This action cannot be undone. The item and all its data will be permanently removed."
  action-label="Delete"
></tct-alert-dialog>
