<!-- title: Clear button and adornments; description: has-clear adds a clear button with a tooltip; start-icon adds a leading icon; the start and end slots take your own adornments. -->
<tct-vstack gap="4">
  <tct-text-input label="Search" label-hidden placeholder="Search wells" start-icon="search" has-clear value="North"></tct-text-input>
  <tct-text-input label="Depth" value="1250">
    <tct-hstack slot="end" padding-inline-end="2"><tct-text color="secondary">m</tct-text></tct-hstack>
  </tct-text-input>
</tct-vstack>
