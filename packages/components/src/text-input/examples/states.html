<!-- title: States; description: disabled with a reason (disabled-message keeps it focusable and explains why), read-only, loading and required and optional indicators. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4)">
  <tct-text-input label="Owner" value="Team North" disabled disabled-message="Only administrators can change the owner."></tct-text-input>
  <tct-text-input label="Created" value="2026-03-04" readonly></tct-text-input>
  <tct-text-input label="Checking name" value="North-7" loading></tct-text-input>
  <tct-text-input label="Well name" required></tct-text-input>
  <tct-text-input label="Nickname" optional></tct-text-input>
</div>
