<!-- title: Sizes; description: sm, md (default) and lg follow the Tecton element sizes. Unset size takes the nearest size provider. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4)">
  <tct-text-input size="sm" label="Small" value="Zip code"></tct-text-input>
  <tct-text-input size="md" label="Medium" value="Full name"></tct-text-input>
  <tct-text-input size="lg" label="Large" value="https://example.com/very/long/address"></tct-text-input>
</div>
