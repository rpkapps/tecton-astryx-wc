<!-- title: Types; description: type takes the native input types that need no extra chrome: text, email, password, search, tel and url. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-4)">
  <tct-text-input type="email" label="Email" autocomplete="email" placeholder="ada@example.com"></tct-text-input>
  <tct-text-input type="password" label="Password" autocomplete="current-password"></tct-text-input>
  <tct-text-input type="tel" label="Phone" autocomplete="tel"></tct-text-input>
  <tct-text-input type="url" label="Website" placeholder="https://"></tct-text-input>
</div>
