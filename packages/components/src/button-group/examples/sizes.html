<!-- title: Sizes; description: The group's size is the default for its members; a member's own size wins. -->
<tct-vstack gap="4" h-align="start">
  <tct-button-group label="Small" size="sm">
    <tct-button label="Copy"></tct-button>
    <tct-button label="Cut"></tct-button>
    <tct-button label="Paste"></tct-button>
  </tct-button-group>
  <tct-button-group label="Medium">
    <tct-button label="Copy"></tct-button>
    <tct-button label="Cut"></tct-button>
    <tct-button label="Paste"></tct-button>
  </tct-button-group>
  <tct-button-group label="Large" size="lg">
    <tct-button label="Copy"></tct-button>
    <tct-button label="Cut"></tct-button>
    <tct-button label="Paste"></tct-button>
  </tct-button-group>
</tct-vstack>
