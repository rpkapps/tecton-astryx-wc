<!-- title: Variants; description: Use one variant for every button so the group reads as one unit. Each member squares its interior corners from its position in the group. -->
<tct-vstack gap="4" h-align="start">
  <tct-button-group label="Primary">
    <tct-button variant="primary" label="Copy"></tct-button>
    <tct-button variant="primary" label="Cut"></tct-button>
    <tct-button variant="primary" label="Paste"></tct-button>
  </tct-button-group>
  <tct-button-group label="Secondary">
    <tct-button label="Copy"></tct-button>
    <tct-button label="Cut"></tct-button>
    <tct-button label="Paste"></tct-button>
  </tct-button-group>
  <tct-button-group label="Ghost">
    <tct-button variant="ghost" label="Copy"></tct-button>
    <tct-button variant="ghost" label="Cut"></tct-button>
    <tct-button variant="ghost" label="Paste"></tct-button>
  </tct-button-group>
  <tct-button-group label="Outlined">
    <tct-button variant="outlined" label="Copy"></tct-button>
    <tct-button variant="outlined" label="Cut"></tct-button>
    <tct-button variant="outlined" label="Paste"></tct-button>
  </tct-button-group>
</tct-vstack>
