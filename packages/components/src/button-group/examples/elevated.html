<!-- title: Elevated; description: elevation puts one shadow on the whole slab so the buttons lift together, following the rounded outer corners. -->
<div style="display: flex; gap: var(--spacing-6); padding: var(--spacing-4)">
  <tct-button-group label="Low" elevation="low">
    <tct-button label="Copy"></tct-button>
    <tct-button label="Cut"></tct-button>
  </tct-button-group>
  <tct-button-group label="High" elevation="high">
    <tct-button label="Copy"></tct-button>
    <tct-button label="Cut"></tct-button>
  </tct-button-group>
</div>
