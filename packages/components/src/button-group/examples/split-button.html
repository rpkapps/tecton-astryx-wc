<!-- title: Split button; description: A main action plus a trailing icon-only member. With a menu component the trailing member becomes its trigger; arrows stay with the open menu. -->
<tct-button-group label="Approve">
  <tct-button variant="primary" label="Allow once"></tct-button>
  <tct-button variant="primary" icon="chevronDown" icon-only label="Allow options"></tct-button>
</tct-button-group>
