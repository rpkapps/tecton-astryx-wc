<!-- title: Custom content; description: renderContent replaces the layout of one toast; the card, semantics and auto-hide stay. The renderer owns every control, so call dismiss from the control that should close the toast. -->
<div id="toast-custom-root">
  <button type="button" id="toast-custom-show">Show custom toast</button>
  <script type="module">
    import {toast} from '@tecton-wc/components/toast/toast.api.js';
    import {html} from 'lit';
    // The toast renders this content in its own shadow root, which the autoloader does not watch: register what it uses.
    import '@tecton-wc/components/hstack';
    import '@tecton-wc/components/link';
    document.getElementById('toast-custom-show').addEventListener('click', () => {
      toast({
        body: 'Export ready',
        autoHide: false,
        renderContent: ({body, dismiss}) => html`
          <tct-hstack h-align="between" v-align="center" gap="3">
            <strong>${body}</strong>
            <tct-link color="inherit" has-underline @click=${dismiss}>Done</tct-link>
          </tct-hstack>`,
      });
    });
  </script>
</div>
