<!-- title: Sizes; description: Small, medium (default) and large. Without a size the control follows an enclosing size provider or toolbar. -->
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-3)">
  <tct-segmented-control label="Small" size="sm" value="a">
    <tct-segmented-control-item value="a" label="Day"></tct-segmented-control-item>
    <tct-segmented-control-item value="b" label="Week"></tct-segmented-control-item>
    <tct-segmented-control-item value="c" label="Month"></tct-segmented-control-item>
  </tct-segmented-control>
  <tct-segmented-control label="Medium" value="a">
    <tct-segmented-control-item value="a" label="Day"></tct-segmented-control-item>
    <tct-segmented-control-item value="b" label="Week"></tct-segmented-control-item>
    <tct-segmented-control-item value="c" label="Month"></tct-segmented-control-item>
  </tct-segmented-control>
  <tct-segmented-control label="Large" size="lg" value="a">
    <tct-segmented-control-item value="a" label="Day"></tct-segmented-control-item>
    <tct-segmented-control-item value="b" label="Week"></tct-segmented-control-item>
    <tct-segmented-control-item value="c" label="Month"></tct-segmented-control-item>
  </tct-segmented-control>
</div>
