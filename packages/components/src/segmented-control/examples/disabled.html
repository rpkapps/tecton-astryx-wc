<!-- title: Disabled; description: A whole control, one segment, and a control that explains itself. The reason is the tooltip and the accessible description; the selected segment stays focusable. -->
<tct-vstack gap="3" h-align="start">
  <tct-segmented-control label="Whole control disabled" value="grid" disabled>
    <tct-segmented-control-item value="grid" label="Grid"></tct-segmented-control-item>
    <tct-segmented-control-item value="list" label="List"></tct-segmented-control-item>
  </tct-segmented-control>
  <tct-segmented-control label="One segment disabled" value="grid">
    <tct-segmented-control-item value="grid" label="Grid"></tct-segmented-control-item>
    <tct-segmented-control-item value="list" label="List" disabled></tct-segmented-control-item>
    <tct-segmented-control-item value="table" label="Table"></tct-segmented-control-item>
  </tct-segmented-control>
  <tct-segmented-control
    label="Disabled with a reason"
    value="grid"
    disabled
    disabled-message="Choose a project to switch views"
  >
    <tct-segmented-control-item value="grid" label="Grid"></tct-segmented-control-item>
    <tct-segmented-control-item value="list" label="List"></tct-segmented-control-item>
  </tct-segmented-control>
</tct-vstack>
