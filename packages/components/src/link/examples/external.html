<!-- title: External links; description: external opens a new tab, adds the icon and a screen-reader hint, and keeps rel="noopener noreferrer". -->
<tct-vstack gap="3" h-align="start">
  <tct-link href="https://example.com" external standalone>Example website</tct-link>
  <tct-link href="https://example.com" external standalone new-tab-label="(opens in a new window)">Custom hint text</tct-link>
</tct-vstack>
