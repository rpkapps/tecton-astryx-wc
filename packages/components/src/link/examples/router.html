<!-- title: Client-side routing; description: tct-link-provider hands plain clicks on internal links to your router. Ctrl/Cmd-click and external links stay native. -->
<tct-vstack id="router-example" gap="3">
  <tct-link-provider>
    <tct-hstack gap="4">
      <tct-link href="/docs">Docs</tct-link>
      <tct-link href="/pricing">Pricing</tct-link>
      <tct-link href="https://example.com" external>Example (native)</tct-link>
    </tct-hstack>
  </tct-link-provider>
  <tct-text>Route handled by the router: <strong data-route>none yet</strong></tct-text>
</tct-vstack>
<script type="module">
  const root = document.getElementById('router-example');
  // A real app calls its router here (history.pushState, router.navigate, ...).
  root.querySelector('tct-link-provider').navigate = (href, event) => {
    root.querySelector('[data-route]').textContent = href;
    return true;
  };
</script>
