<!-- title: Tooltip and icon-only; description: A tooltip describes the destination on hover and keyboard focus. An icon-only link needs a label, its accessible name. -->
<div style="display: flex; align-items: center; gap: var(--spacing-6); padding-block-start: var(--spacing-8)">
  <tct-link href="#settings" standalone tooltip="Configure your workspace">Settings</tct-link>
  <tct-link href="#home" label="Home" tooltip="Home"><tct-icon name="home"></tct-icon></tct-link>
</div>
