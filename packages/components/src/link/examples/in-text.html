<div style="display: flex; flex-direction: column; gap: var(--spacing-4); max-inline-size: 420px">
  <tct-text>
    Read our <tct-link href="#terms" type="inherit" has-underline>terms of service</tct-link> before you continue.
  </tct-text>
  <tct-text type="large">
    Larger copy: <tct-link href="#privacy" type="inherit" has-underline>see the privacy policy</tct-link>.
  </tct-text>
</div>
