<!-- title: Disabled; description: A disabled link is a plain anchor without href: it cannot be focused, followed or clicked, and it keeps its underline policy. -->
<div style="display: flex; flex-direction: column; gap: var(--spacing-3); align-items: flex-start">
  <tct-link href="#docs" standalone disabled>Documentation (unavailable)</tct-link>
  <tct-link href="#docs" standalone disabled has-underline>Underlined and disabled</tct-link>
</div>
