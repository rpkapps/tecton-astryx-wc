<!-- title: With an icon; description: A favicon by URL (source-src) or a node icon in the icon slot. -->
<div style="display: flex; gap: var(--spacing-2); align-items: center; flex-wrap: wrap">
  <tct-citation number="1" source-title="Documentation" source-url="https://example.com">
    <tct-icon slot="icon" name="externalLink" size="xsm"></tct-icon>

  <tct-citation number="2" source-title="Research paper" source-url="https://example.org">
    <tct-icon slot="icon" name="info" size="xsm"></tct-icon>
  </tct-citation>
</div>
